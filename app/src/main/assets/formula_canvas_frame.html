<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif; user-select: none; }
.mb-wrap { margin: 0; padding: 4px; width: 100%; height: 100%; display: flex; box-sizing: border-box; background: transparent; }
.mb-canvas { width: 100%; height: 100%; min-height: 0; margin: 0; box-sizing: border-box; border-radius: 16px; background: rgba(30, 30, 56, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.18); color: #ffffff; font-size: calc(1.5rem * var(--mbfs, 1)); line-height: 1.4; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 4px; overflow-x: auto; overflow-y: hidden; outline: none; }
.mb-box { min-width: 1.1em; min-height: 1.3em; border: 1.5px dashed rgba(255,255,255,0.4); border-radius: 6px; padding: 1px 4px; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); color: #ffffff; cursor: pointer; transition: all 0.15s ease; font-family: inherit; font-size: 0.95em; vertical-align: middle; }
.mb-box.active { border: 2px solid #10B981 !important; background: rgba(16, 185, 129, 0.22) !important; box-shadow: 0 0 10px rgba(16, 185, 129, 0.45); }
.mb-box:hover:not(.active) { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.1); }
.mb-cursor { display: inline-block; width: 2px; height: 1.2em; background: #10B981; animation: mbBlink 1s infinite; vertical-align: middle; margin: 0 1px; }
@keyframes mbBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.mb-frac { display: inline-flex; flex-direction: column; vertical-align: middle; margin: 0 3px; align-items: center; text-align: center; font-size: 0.9em; }
.mb-num, .mb-den { padding: 1px 4px; display: inline-flex; justify-content: center; align-items: center; min-height: 1.1em; }
.mb-frac-line { width: 100%; height: 1.8px; background: #ffffff; margin: 2px 0; border-radius: 1px; }
.mb-sqrt { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 3px; font-size: 0.95em; }
.mb-radical { font-size: 1.35em; line-height: 1; margin-right: 1px; padding-bottom: 2px; }
.mb-sqrt-body { border-top: 1.8px solid #ffffff; padding: 2px 4px 1px 4px; display: inline-flex; align-items: center; min-height: 1.1em; }
.mb-power { display: inline-flex; align-items: flex-start; vertical-align: middle; margin: 0 1px; }
.mb-sup { font-size: 0.72em; transform: translateY(-0.55em); margin-left: 1px; display: inline-flex; }
.mb-sub { font-size: 0.72em; transform: translateY(0.45em); margin-left: 1px; display: inline-flex; }
.mb-matrix { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 4px; border-left: 2px solid #fff; border-right: 2px solid #fff; border-radius: 4px; padding: 2px 5px; }
.mb-matrix-grid { display: grid; gap: 4px 6px; text-align: center; }
</style>
</head>
<body>
<div class="mb-wrap"><div class="mb-canvas" id="canvas" tabindex="0"></div></div>
<script>
var canvas = document.getElementById("canvas");
var currentTex = "";
var boxes = [];
var activeIndex = 0;

function renderTex(tex) {
  currentTex = tex || "";
  canvas.innerHTML = "";
  if (!tex || tex.trim() === "") {
    var b = createBox(0, "");
    canvas.appendChild(b);
    boxes = [b];
    setActive(0);
    return;
  }
  var parts = parseSimple(tex);
  boxes = [];
  parts.forEach(function(p, i) {
    if (p.isBox) {
      var boxEl = createBox(boxes.length, p.text);
      canvas.appendChild(boxEl);
      boxes.push(boxEl);
    } else {
      var s = document.createElement("span");
      s.textContent = p.text;
      canvas.appendChild(s);
    }
  });
  if (boxes.length > 0) setActive(Math.min(activeIndex, boxes.length - 1));
}

function createBox(idx, content) {
  var b = document.createElement("span");
  b.className = "mb-box";
  b.textContent = content;
  b.onclick = function(e) { e.stopPropagation(); setActive(idx); };
  return b;
}

function setActive(idx) {
  if (idx < 0 || idx >= boxes.length) return;
  boxes.forEach(function(b, i) {
    if (i === idx) b.classList.add("active");
    else b.classList.remove("active");
  });
  activeIndex = idx;
}

function parseSimple(t) {
  var out = [];
  var re = /\square|\placeholder|□/g;
  var last = 0, m;
  while ((m = re.exec(t)) !== null) {
    if (m.index > last) out.push({ isBox: false, text: t.slice(last, m.index) });
    out.push({ isBox: true, text: "" });
    last = re.lastIndex;
  }
  if (last < t.length) out.push({ isBox: false, text: t.slice(last) });
  if (out.length === 0) out.push({ isBox: true, text: t });
  return out;
}

function notifyNative() {
  if (window.AndroidCanvas && window.AndroidCanvas.onFormulaChange) {
    window.AndroidCanvas.onFormulaChange(currentTex);
  }
}

window.setFormula = function(t) { renderTex(t); };
window.insertFormula = function(f) {
  if (boxes[activeIndex]) {
    boxes[activeIndex].textContent = f;
    notifyNative();
  }
};
window.typeCharacter = function(c) {
  if (boxes[activeIndex]) {
    boxes[activeIndex].textContent += c;
    notifyNative();
  }
};
window.backspace = function() {
  if (boxes[activeIndex]) {
    var txt = boxes[activeIndex].textContent;
    if (txt.length > 0) {
      boxes[activeIndex].textContent = txt.slice(0, -1);
      notifyNative();
    } else if (activeIndex > 0) {
      setActive(activeIndex - 1);
    }
  }
};
window.moveCursor = function(d) { setActive(activeIndex + d); };
window.setZoom = function(z) { document.documentElement.style.setProperty("--mbfs", z); };
window.focusCanvas = function() { canvas.focus(); };
</script>
</body>
</html>
