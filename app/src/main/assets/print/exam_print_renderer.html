<!doctype html>
<!--
  موتور مستقل چاپ و پیش‌نمایش آزمون (V105).
  ورودی: window.setExamData(data)
  خروجی‌های عمومی: printStudent، printTeacher و ExamPrintRenderer.
  فرمول‌ها و شکل‌ها با رندررهای بومی از طریق ExamPrintBridge به data URL امن
  تبدیل می‌شوند؛ این فایل عمداً هیچ ابزار ساخت یا ویرایش متن ندارد.
  V105: هفت قالبِ سربرگِ اصلی، جدولِ «ردیف/متن سؤال/بارم» و حرکتِ کاملاً آزادِ
  شکل‌ها روی کلِ برگه (بدون اسکرولِ صفحه هنگامِ درگ).
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پیش‌نمایش چاپ آزمون</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("/fonts/vazirmatn_regular.ttf");font-weight:400}
@font-face{font-family:"Vazirmatn";src:url("/fonts/vazirmatn_bold.ttf");font-weight:700}
@font-face{font-family:"Shabnam";src:url("/fonts/shabnam_regular.ttf")}
@font-face{font-family:"Sahel";src:url("/fonts/sahel_regular.ttf")}
@font-face{font-family:"BNazanin";src:url("/fonts/bnazanin.ttf");font-weight:400}
@font-face{font-family:"BNazanin";src:url("/fonts/bnazanin_bold.ttf");font-weight:700}
:root{color-scheme:light;--ink:#111;--muted:#56657a;--paper:#fff;--screen:#e8edf3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--screen);color:var(--ink);font-family:Tahoma,"Vazirmatn","Segoe UI",sans-serif}
body{padding:18px 12px 28px;-webkit-print-color-adjust:exact;print-color-adjust:exact;overscroll-behavior:contain}
body.dragging{touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
/* V114 — هدر ثابت (fixed) با نوارِ قالب‌بندیِ اسکرول‌شونده؛ بستن = ضربدر قرمز */
#screenChrome{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-direction:column;gap:6px;margin:0;padding:6px 8px;border:0;border-bottom:1px solid #ced8e2;border-radius:0;background:rgba(255,255,255,.98);box-shadow:0 4px 16px rgba(15,23,42,.10)}
.chrome-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#closePreview{width:34px;height:34px;padding:0;border-radius:50%;background:#dc2626;color:#fff;font:900 18px/1 inherit;display:inline-flex;align-items:center;justify-content:center}
#fmtBar{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;direction:rtl}
#fmtBar>*{flex:0 0 auto}
.fmt-btn{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;min-width:34px;height:32px;padding:0 9px;font:700 13px inherit;cursor:pointer}
.fmt-btn.on{background:#0f766e;color:#fff;border-color:#0f766e}
.fmt-btn.b{font-weight:900}.fmt-btn.i{font-style:italic}.fmt-btn.u{text-decoration:underline}
.fmt-select{height:32px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:700 12px inherit;padding:0 6px}
.fmt-color{width:34px;height:32px;padding:0 2px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.fmt-hint{font-size:11px;color:var(--muted);align-self:center}
body{padding-top:96px}
.styled-underline{text-decoration:underline}
.exam-print-mode #screenChrome{display:none}body.exam-print-mode{padding-top:0}
#screenChrome strong{font-size:13px}
#screenChrome span{font-size:11px;color:var(--muted)}
#closePreview,#fitToggle{border:0;border-radius:8px;padding:8px 13px;background:#334155;color:#fff;font:700 12px inherit;cursor:pointer}
#fitToggle{background:#0f766e}.chrome-actions{display:flex;gap:8px}
/* V107 — حالتِ «کل صفحه»: برگهٔ A4 با transform در پهنای صفحه جا می‌شود. */
/* V113.2 — سند RTL است: بدون direction:ltr روی سطح، برگهٔ ۲۱۰mm با margin:0 به
   لبهٔ راست می‌چسبد و (چون پهن‌تر از صفحه است) به‌کل از سمت چپ بیرون می‌افتد و
   دیده نمی‌شود. سطحِ fit-page چپ‌چین می‌شود و خودِ برگه RTL می‌ماند. */
#printSurface.fit-page{direction:ltr}
#printSurface.fit-page #sheet{transform-origin:top left;margin:0;direction:rtl}
/* V113 — «کل صفحه»: هیچ اسکرول افقی‌ای نه در سطح (surface) و نه در صفحه.
   «اندازهٔ واقعی»: خودِ صفحه (نه یک جعبهٔ تودرتو) اسکرول می‌شود و پهنای
   سند دقیقاً پهنای برگه (210mm) است — نه بیشتر. */
html.fit-mode,html.fit-mode body{overflow-x:hidden}
html.fit-mode #printSurface{overflow:hidden}
html.real-mode body{padding-left:0;padding-right:0}
html.real-mode #printSurface{overflow:visible;width:max-content;min-width:100%;margin:0 auto}
#printSurface{width:100%;overflow:auto;padding:2px 0 18px}
#sheet{position:relative;width:210mm;min-height:297mm;margin:0 auto;padding:8mm;background:var(--paper);border:2px solid #000;border-radius:6px;box-shadow:0 7px 28px rgba(15,23,42,.24);font-size:10pt;line-height:1.75;overflow:visible}
/* ===== سربرگ‌ها — عیناً از آزمون‌سازِ مرجع ===== */
  /* ===== HEADER TEMPLATE 2 ===== */
  .exam-header2 {
    width: 100%; border: 3px solid #000; margin-bottom: 8px; background:#fff;
     overflow: hidden;
  }
  .h2-top {
    position: relative; display: grid; grid-template-columns: 21% 58% 21%;
    align-items: center; min-height: 92px; border-bottom: 3px solid #000; direction: ltr;
  }
  .h2-chair-box {
    justify-self: start; margin-left: 8px; width: 195px; max-width: calc(100% - 14px); height: 44px;
    border: 3px solid #000; display:flex; align-items:center; justify-content:flex-start;
    padding: 0 12px; font-size: 11pt; font-weight: 700; direction: rtl; text-align: right;
  }
  .h2-title-block { text-align:center; direction: rtl; line-height: 1.45; }
  .h2-bism { font-size: 14pt; font-weight: 800; }
  .h2-university { font-size: 16pt; font-weight: 900; }
  .h2-sub { font-size: 10.5pt; font-weight: 600; }
  .h2-examline { font-size: 11pt; font-weight: 700; }
  .h2-logo-wrap { justify-self:end; align-self:stretch; display:flex; align-items:center; justify-content:center; padding-left: 8px; padding-right: 12px; }
  .h2-logo-img { width: 70px; height:auto; }
  .h2-info-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13pt; font-weight: 900; direction: rtl; }
  .h2-info-table td { border-top: 3px solid #000; border-left: none; border-right: none; padding: 7px 10px; height: 44px; vertical-align: middle; text-align: right; }
  .h2-info-table tr:first-child td { border-top: none; }
  .h2-info-table .h2-label { font-weight: 900; }
  .h2-info-table .h2-val { font-weight: 700; padding-right: 7px; }

  /* ===== HEADER TEMPLATE 3 - SAMA ===== */
  .exam-header3 { width:100%; border:3px solid #000; background:#fff; margin-bottom:8px;  overflow:hidden; }
  .h3-top { position:relative; min-height:72px; border-bottom:3px solid #000; direction:ltr; display:grid; grid-template-columns:15% 70% 15%; align-items:center; padding:4px 10px; }
  .h3-logo { justify-self:start; align-self:start; width:48px; height:auto; max-height:64px; object-fit:contain; display:block; }
  .h3-title { text-align:center; direction:rtl; line-height:1.22; align-self:center; }
  .h3-bism { font-size:10.5pt; font-weight:800; margin-bottom:1px; }
  .h3-quote { display:inline-block; border:2px solid #000; border-radius:8px; padding:3px 14px; font-size:10.5pt; font-weight:900; margin:1px 0 4px; min-width:62%; }
  .h3-unit { font-size:10.8pt; font-weight:900; }
  .h3-office-row { display:flex; gap:38px; justify-content:center; font-size:9.8pt; font-weight:800; margin-top:1px; }
  .h3-info { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; font-size:9.8pt; font-weight:800; }
  .h3-info td { border-top:3px solid #000; padding:3px 8px; vertical-align:middle; text-align:right; }
  .h3-info tr:first-child td { border-top:none; }
  .h3-side { width:11.5%; border-left:3px solid #000; text-align:center !important; font-weight:900; line-height:1.35; font-size:9.5pt; }
  .h3-main { width:88.5%; line-height:1.55; }
  .h3-line { display:flex; flex-wrap:wrap; gap:14px; align-items:baseline; }
  .h3-item { white-space:nowrap; }
  .h3-label { font-weight:900; }
  .h3-val { display:inline-block; min-width:70px; border-bottom:none; padding:0 6px 0; text-align:center; font-weight:700; }
  .h3-val.long { min-width:155px; }
  .h3-val.med { min-width:110px; }

  /* ===== HEADER TEMPLATE 4 - SCHOOL ===== */
  .exam-header4 { width:100%; background:#fff;  margin-bottom:8px; }
  .h4-topline { position:relative; min-height:30px; text-align:center; font-size:14pt; font-weight:900; line-height:30px; }
  .h4-page { position:absolute; left:58px; top:0; font-size:9.5pt; font-weight:700; }
  .h4-table { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; border:2.5px solid #000; font-size:12pt; font-weight:700; }
  .h4-table td { border:1.8px solid #000; padding:4px 10px; height:34px; vertical-align:middle; text-align:right; line-height:1.45; }
  .h4-right { width:40%; }
  .h4-center { width:29%; text-align:center !important; font-size:13pt; font-weight:800; }
  .h4-left { width:31%; }
  .h4-school { font-size:15pt; font-weight:900; }
  .h4-label { font-weight:900; }
  .h4-val { display:inline-block; min-width:80px; border-bottom:none; padding:0 6px; text-align:center; font-weight:700; }
  .h4-val.long { min-width:210px; }
  .h4-val.med { min-width:135px; }
  .h4-datebox { display:inline-block; min-width:82px; border-bottom:2px solid #000; text-align:center; font-weight:900; margin-right:8px; }
  .h4-note-label { display:inline-block; border-bottom:1.8px solid #000; font-weight:900; }

  /* ===== HEADER TEMPLATE 5 - EDUCATION OFFICE ===== */
  .exam-header5 { width:100%; border:2.5px solid #000; background:#fff; margin-bottom:8px;  overflow:hidden; }
  .h5-top { display:grid; grid-template-columns:30% 40% 30%; direction:rtl; min-height:210px; padding:10px 12px 6px; align-items:start; }
  .h5-col { font-size:12.5pt; font-weight:700; line-height:2.05; }
  .h5-right { text-align:right; padding-right:4px; }
  .h5-left { text-align:right; padding-right:28px; }
  .h5-center { text-align:center; font-size:13.5pt; font-weight:700; line-height:1.9; padding-top:0; }
  .h5-bism { font-size:13pt; font-weight:800; margin-bottom:6px; }
  .h5-seal { margin-top:4px; }
  .h5-page { margin-top:18px; text-align:left; padding-left:4px; }
  .h5-label { font-weight:800; }
  .h5-val { display:inline-block; min-width:135px; border-bottom:none; padding:0 6px; text-align:center; font-weight:700; }
  .h5-val.short { min-width:78px; }
  .h5-val.med { min-width:110px; }
  .h5-val.long { min-width:175px; }
  .h5-bottom { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; border-top:2.5px solid #000; font-size:12pt; font-weight:700; }
  .h5-bottom td { border-left:2px solid #000; padding:8px 12px; height:98px; vertical-align:top; text-align:right; line-height:2; }
  .h5-bottom td:last-child { border-left:none; }
  .h5-vertical { width:4.2%; writing-mode:vertical-rl; text-orientation:mixed; text-align:center !important; vertical-align:middle !important; padding:4px !important; font-weight:800; }
  .h5-sign { width:45.8%; }
  .h5-sign-row { display:flex; justify-content:space-between; gap:28px; margin-bottom:4px; }

  /* ===== HEADER TEMPLATE 6 - DETAILED SCHOOL WITH GRADERS ===== */
  .exam-header6 { width:100%; border:3px double #000; background:#fff; margin-bottom:8px;  overflow:hidden; }
  .h6-top { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; font-size:11.5pt; font-weight:700; }
  .h6-top td { border:1px solid #e5d8c2; padding:4px 10px; height:31px; vertical-align:middle; text-align:right; line-height:1.35; }
  .h6-right { width:32%; }
  .h6-center { width:34%; text-align:center !important; font-size:12.5pt; }
  .h6-left { width:34%; }
  .h6-bism { font-weight:800; font-size:12pt; }
  .h6-school { font-size:14pt; font-weight:900; }
  .h6-bold { font-weight:900; }
  .h6-label { font-weight:800; }
  .h6-val { display:inline-block; min-width:130px; border-bottom:none; padding:0 5px; text-align:center; font-weight:700; }
  .h6-val.short { min-width:65px; }
  .h6-val.med { min-width:100px; }
  .h6-val.long { min-width:190px; }
  .h6-correct { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; border-top:3px solid #000; font-size:11.5pt; font-weight:700; }
  .h6-correct td { border:2px solid #000; padding:5px 8px; height:32px; vertical-align:middle; text-align:right; line-height:1.4; }
  .h6-correct .h6-title { text-align:center !important; font-weight:900; font-size:12.5pt; height:32px; }
  .h6-correct .h6-small { height:28px; }
  .h6-final { width:100%; border-collapse:collapse; table-layout:fixed; direction:rtl; border-top:none; font-size:12.5pt; font-weight:900; }
  .h6-final td { border:2px solid #000; padding:5px 8px; height:34px; text-align:center; vertical-align:middle; }
  .h6-final .h6-rownum { width:6.5%; }
  .h6-final .h6-barem { width:7.5%; }
  .h6-final .h6-questions { width:86%; }

  /* ===== HEADER TEMPLATE 7 - MINISTRY OF EDUCATION ===== */
  .exam-header7 { width:100%; border:3px double #000; background:#fff; margin-bottom:8px;  overflow:hidden; }
  .h7-wrap { display:grid; grid-template-columns:31% 38% 31%; direction:rtl; align-items:center; min-height:185px; padding:10px 14px; }
  .h7-col { font-size:13.5pt; font-weight:700; line-height:2.25; }
  .h7-right { text-align:right; }
  .h7-left { text-align:right; padding-right:22px; }
  .h7-center { text-align:center; font-size:15pt; font-weight:700; line-height:1.95; }
  .h7-emblem { width:62px; height:auto; display:block; margin:0 auto 4px; }
  .h7-school { font-size:15.5pt; font-weight:800; }
  .h7-label { font-weight:800; }
  .h7-val { display:inline-block; min-width:150px; border-bottom:none; padding:0 6px; text-align:center; font-weight:700; }
  .h7-val.short { min-width:85px; }
  .h7-val.med { min-width:125px; }
  .h7-val.long { min-width:185px; }

  /* ===== COMPACT EXACT HEADER (half height) ===== */
  .exam-header {
    width: 100%;
    border: 2.5px solid #000;
    border-collapse: collapse;
    table-layout: fixed;
    margin-bottom: 0;
    font-size: 10pt;
  }
  .exam-header td {
    border: 1.5px solid #000;
    padding: 2px 8px;
    vertical-align: middle;
    font-weight: 700;
    line-height: 1.3;
    height: 22px;
  }
  .right-cell { width: 34%; text-align: right; padding-right: 10px; }
  .left-cell { width: 34%; text-align: right; padding-right: 10px; padding-left: 6px; direction: rtl; }
  .center-cell { width: 32%; text-align: center; vertical-align: middle; padding: 2px 4px; }
  .logo-cell { padding: 2px; background: #fff; }
  .uni-name { font-size: 11pt; font-weight: 900; margin: 0; }
  .branch-name { font-size: 10.5pt; font-weight: 900; margin: 0; }
  .grades-date-row td {
    text-align: center; font-weight: 700; font-size: 10pt; padding: 3px 8px; height: 22px;
  }
  .scores-table {
    width: 100%;
    border: 2.5px solid #000;
    border-top: none;
    border-collapse: collapse;
    table-layout: fixed;
    margin-bottom: 8px;
    font-size: 10pt;
  }
  .scores-table td {
    border: 1.5px solid #000;
    padding: 6px 6px;
    text-align: center;
    font-weight: 700;
    vertical-align: middle;
    height: 28px;
  }
  .iau-logo { display: block; margin: 0 auto; width: 60px; height: auto; }

  .exam-intro { font-size: 10pt; margin: 8px 0; text-align: center; }
/* ===== جدول سؤال‌ها (ردیف / متن سؤال / بارم) ===== */
.questions-print-table{width:100%;margin:0;border-collapse:collapse;table-layout:fixed;direction:rtl}
.questions-print-table thead{display:table-row-group}
.questions-print-table th,.questions-print-table td{border:1px solid #000;vertical-align:top}
.questions-print-table tr{break-inside:avoid;page-break-inside:avoid}
.questions-print-table th{text-align:center;font-weight:900;min-height:46px;padding:5px 7px}
.questions-print-table .qno-col,.questions-print-table .qscore-col{width:6%;text-align:center}
.questions-print-table .qmain-col{width:88%}
.questions-print-table .qno-head,.questions-print-table .qscore-head{writing-mode:vertical-rl;text-orientation:mixed}
.questions-print-table .question-main-td{position:relative;padding:8px 10px;line-height:1.75}
.questions-print-table .question-no-td,.questions-print-table .question-score-td{padding:8px 4px;text-align:center;font-weight:800}
.question-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:6px}
.question-main-td[data-align="center"] .question-text{text-align:center}.question-main-td[data-align="left"] .question-text{text-align:left;direction:ltr}.question-main-td[data-align="justify"] .question-text{text-align:justify}.question-main-td[data-bold="true"] .question-text{font-weight:700}.question-main-td[data-italic="true"] .question-text{font-style:italic}.styled-bold{font-weight:800}.styled-italic{font-style:italic}
.math{display:inline-block;vertical-align:middle;max-width:min(100%,260px);max-height:2.5em;width:auto;height:auto;margin:0 2px}.math-fallback{font-family:serif;direction:ltr;unicode-bidi:isolate;font-size:.95em;color:#1e293b}
/* ===== شکل‌ها ===== */
.figure-slot{position:relative;display:inline-block;vertical-align:middle;min-width:42px;min-height:32px;margin:3px 4px;line-height:0}
.print-figure{position:relative;display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;max-width:100%;min-width:42px;min-height:32px;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.print-figure>img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:transparent;pointer-events:none;-webkit-user-drag:none}
.print-figure.free{position:absolute;z-index:5;max-width:none;background:transparent}
.figure-slot.free-slot{opacity:0;pointer-events:none}
.preview-open .figure-slot.free-slot{opacity:1;border:1px dashed #b9c4d3;border-radius:4px}
.print-figure.selected{outline:2px solid #0f766e;outline-offset:3px;z-index:8}
.figure-handle{display:none;position:absolute;left:-9px;bottom:-9px;width:22px;height:22px;border:2px solid #fff;border-radius:50%;background:#0f766e;color:#fff;font:700 12px/17px sans-serif;text-align:center;cursor:nwse-resize;z-index:9;touch-action:none}
.preview-open .print-figure:hover .figure-handle,.preview-open .print-figure.selected .figure-handle{display:block}
/* ===== گزینه‌ها / پاسخ ===== */
.options{display:grid;gap:3px 20px;margin:2px 18px 1px 2px;line-height:1.7}
.options.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.options.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.options.cols-1{grid-template-columns:1fr}
.option{white-space:pre-wrap;overflow-wrap:anywhere}
.choice-mark{display:inline-block;width:11px;height:11px;border:1.5px solid #000;border-radius:50%;margin-left:6px;vertical-align:middle}
.option .letter{font-weight:700;margin-left:6px}
.option.correct .letter{color:#166534}
.option.correct .tick{color:#166534;font-weight:900;margin-right:4px}
.teacher-answer{margin-top:5px;color:#166534;font-weight:800;font-size:9.5pt;white-space:pre-wrap}
.match-list-preview{margin-top:8px}
.match-head-row,.match-pair-row{display:grid;grid-template-columns:1fr 16px 30px 16px 1fr;align-items:center;column-gap:6px}
.match-head-row{margin-bottom:5px;font-weight:900;text-align:center}
.match-pair-row{min-height:28px;line-height:1.7}
.match-text-right,.match-text-left{text-align:center;white-space:pre-wrap}
.match-dot{width:10px;height:10px;border:1.5px solid #000;border-radius:50%;display:inline-block;justify-self:center}
.answer-space{margin-right:18px;margin-top:2px;margin-bottom:8px}
.answer-line-row{height:28px;border-bottom:1px dotted #555}
.answer-space.plain{min-height:28px}

  /* V107 — پیش‌فرضِ پیش‌نمایش: کل برگهٔ A4 در پهنای صفحه (fit-page). دکمه بین
     «کل صفحه» و «اندازهٔ واقعی» جابه‌جا می‌کند؛ زومِ دوانگشتی همچنان آزاد است. */
