name: ساخت و بررسی APK اندروید
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v5
      - name: آماده‌سازی Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: اجرای تست‌ها
        run: ./gradlew testDebugUnitTest
      - name: ساخت APK آزمایشی
        run: ./gradlew assembleDebug
      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-app-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
