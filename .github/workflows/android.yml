name: ساخت APK آزمایشی و Release Kotlin
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-publisher
  cancel-in-progress: false

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v5
      - name: آماده‌سازی Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: آماده‌سازی Supabase و نسخه خودکار برنامه
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          NOW_UTC="$(date -u +%s)"
          EPOCH_2020=1577836800
          APP_VERSION_CODE=$((NOW_UTC - EPOCH_2020))
          APP_VERSION_NAME="$(date -u +'%Y.%m.%d.%H%M%S')-native"
          test "$APP_VERSION_CODE" -gt 0
          test "$APP_VERSION_CODE" -le 2100000000
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$APP_VERSION_CODE" "$APP_VERSION_NAME" \
            > local.properties
          printf 'APP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\n' \
            "$APP_VERSION_CODE" "$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building automatic version $APP_VERSION_NAME ($APP_VERSION_CODE)"
      - name: بررسی امن اتصال Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase profiles status: $STATUS"
          test "$STATUS" = "200"

      - name: اجرای تست‌ها
        run: ./gradlew testDebugUnitTest
      - name: آماده‌سازی امضای Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/keystore.properties
      - name: ساخت APK Release امضاشده
        run: ./gradlew assembleRelease
      - name: آماده‌سازی بسته انتشار و مشخصات نسخه
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          mkdir -p release
          APK_FILE="exam-app-${APP_VERSION_NAME}-${APP_VERSION_CODE}.apk"
          cp "$SOURCE_APK" "release/$APK_FILE"
          APK_SHA256="$(sha256sum "release/$APK_FILE" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s "release/$APK_FILE")"
          printf 'APP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\nAPK_FILE=%s\nAPK_SHA256=%s\nAPK_SIZE_BYTES=%s\n' \
            "$APP_VERSION_CODE" "$APP_VERSION_NAME" "$APK_FILE" "$APK_SHA256" "$APK_SIZE_BYTES" \
            > release/update-metadata.txt
          cat release/update-metadata.txt
      - name: بارگذاری APK و مشخصات نسخه در Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-app-release-run-${{ github.run_number }}
          path: release/
          if-no-files-found: error
      - name: انتشار خودکار APK در Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          set -Eeuo pipefail

          safe_error_report() {
            python3 - "$1" "$2" <<'PY'
          import json
          import re
          import sys

          path, prefix = sys.argv[1], sys.argv[2]

          def clean(value):
              text = str(value if value not in (None, "") else "none")
              text = re.sub(r"https?://\S+", "[URL]", text, flags=re.I)
              text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9_-]{10,}){1,2}", "[TOKEN]", text)
              text = re.sub(r"sb_(?:secret|publishable)_[A-Za-z0-9_-]+", "[KEY]", text, flags=re.I)
              text = re.sub(r"(?i)(authorization|apikey)\s*[:=][^,\n ]+", r"\1=[REDACTED]", text)
              return text.replace("\n", " ")[:500]

          try:
              data = json.load(open(path, encoding="utf-8"))
              if not isinstance(data, dict):
                  data = {"code": "unknown", "message": "non-object response"}
          except Exception:
              data = {"code": "unavailable", "message": "response was not valid JSON"}

          for key in ("code", "message", "details", "hint"):
              print(f"{prefix} safe error {key}: {clean(data.get(key))}")
          PY
          }

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_RELEASE_KEY"
          SUPABASE_URL="${SUPABASE_URL%/}"

          RELEASE_AUTH_HEADERS=(-H "apikey: $SUPABASE_RELEASE_KEY")
          if [[ "$SUPABASE_RELEASE_KEY" == sb_secret_* ]]; then
            echo "Release key mode: opaque secret key (apikey header only)"
          else
            echo "Release key mode: legacy server JWT"
            RELEASE_AUTH_HEADERS+=(-H "Authorization: Bearer $SUPABASE_RELEASE_KEY")
          fi

          source release/update-metadata.txt
          test -f "release/$APK_FILE"
          APK_PUBLIC_URL="$SUPABASE_URL/storage/v1/object/public/app-updates/$APK_FILE"

          UPLOAD_STATUS="$(curl -sS \
            --connect-timeout 20 \
            --max-time 600 \
            --retry 3 \
            --retry-all-errors \
            -o /tmp/app-update-storage-response.json \
            -w '%{http_code}' \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/app-updates/$APK_FILE" \
            "${RELEASE_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@release/$APK_FILE")"
          case "$UPLOAD_STATUS" in
            200|201) ;;
            *)
              echo "Supabase Storage upload status: $UPLOAD_STATUS"
              safe_error_report /tmp/app-update-storage-response.json "Supabase Storage"
              exit 1
              ;;
          esac
          echo "Supabase Storage upload status: $UPLOAD_STATUS"

          curl -fsS \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 5 \
            --retry-all-errors \
            --range 0-0 \
            -o /dev/null \
            "$APK_PUBLIC_URL"
          echo "Public APK verification: OK"

          export APK_PUBLIC_URL GITHUB_SHA
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {}
          for line in Path("release/update-metadata.txt").read_text().splitlines():
              key, value = line.split("=", 1)
              metadata[key] = value

          payload = {
              "p_version_code": int(metadata["APP_VERSION_CODE"]),
              "p_version_name": metadata["APP_VERSION_NAME"],
              "p_notes_fa": [
                  f"انتشار خودکار نسخه {metadata['APP_VERSION_NAME']}",
                  f"ساخت GitHub از commit {os.environ['GITHUB_SHA'][:7]}"
              ],
              "p_apk_url": os.environ["APK_PUBLIC_URL"],
              "p_apk_sha256": metadata["APK_SHA256"],
              "p_apk_size_bytes": int(metadata["APK_SIZE_BYTES"]),
              "p_is_required": False
          }
          Path("release/publish-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          echo "Release RPC endpoint: publish_native_app_release_v1"
          PUBLISH_STATUS="$(curl -sS \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-all-errors \
            -o /tmp/app-update-publish-response.json \
            -w '%{http_code}' \
            -X POST \
            "$SUPABASE_URL/rest/v1/rpc/publish_native_app_release_v1" \
            "${RELEASE_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @release/publish-payload.json)"
          case "$PUBLISH_STATUS" in
            200|201) ;;
            *)
              echo "Supabase release activation status: $PUBLISH_STATUS"
              safe_error_report /tmp/app-update-publish-response.json "Supabase release"
              exit 1
              ;;
          esac
          echo "Supabase release activation status: $PUBLISH_STATUS"
          echo "Automatic app update publication: SUCCESS"
