name: ساخت APK آزمایشی و Release Kotlin
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-publisher
  cancel-in-progress: false

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v5
      - name: اسکن Secret و فایل امضای ناخواسته
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          forbidden_files = [p for p in files if re.search(r'(?i)(release[.]keystore|[.]jks$|[.]p12$|keystore[.]properties$|(^|/)[.]env($|[.]))', p)]
          patterns = {
              'private_key': re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY'),
              'jwt': re.compile(r'eyJ[A-Za-z0-9_-]{20,}[.]eyJ[A-Za-z0-9_-]{20,}[.][A-Za-z0-9_-]{10,}'),
              'supabase_secret': re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
          }
          findings = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              text = path.read_text(errors='ignore')
              for label, pattern in patterns.items():
                  if pattern.search(text): findings.append(f'{label}:{name}')
          if forbidden_files or findings:
              print('Forbidden security material detected')
              print('\n'.join(forbidden_files + findings))
              sys.exit(1)
          print(f'Security source scan: PASS ({len(files)} tracked files)')
          PY
      - name: بررسی نهایی حذف WebView و hardening
        run: python3 scripts/verify_native_final.py
      - name: آماده‌سازی Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: آماده‌سازی Deno برای بررسی Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: بررسی TypeScript همه Edge Functionها
        run: deno check supabase/functions/*/index.ts
      - name: آماده‌سازی Supabase و نسخه خودکار برنامه
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          NOW_UTC="$(date -u +%s)"
          EPOCH_2020=1577836800
          APP_VERSION_CODE=$((NOW_UTC - EPOCH_2020))
          APP_VERSION_NAME="$(date -u +'%Y.%m.%d.%H%M%S')-native"
          test "$APP_VERSION_CODE" -gt 0
          test "$APP_VERSION_CODE" -le 2100000000
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$APP_VERSION_CODE" "$APP_VERSION_NAME" \
            > local.properties
          printf 'APP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\n' \
            "$APP_VERSION_CODE" "$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building automatic version $APP_VERSION_NAME ($APP_VERSION_CODE)"
      - name: بررسی امن اتصال عمومی Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # مسیر واقعی برنامه Kotlin: خواندن جدول app_version با کلید anon (RLS).
          # اگر این مسیر 200 بدهد، بررسی نسخه داخل برنامه هم کار می‌کند.
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_version?select=version_code&is_active=eq.true&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase app_version public status: $STATUS"
          test "$STATUS" = "200"
          # RPC جانبی check_app_update فقط برای کلاینت‌های دیگر است و نباید CI را بلاک کند.
          RPC_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/check_app_update" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{"p_current_version_code":0}')
          echo "check_app_update RPC status (informational): $RPC_STATUS"

      - name: اجرای تست‌ها و Lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: آماده‌سازی امضای Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/keystore.properties
      - name: ساخت APK Release امضاشده
        run: ./gradlew assembleRelease
      - name: تطبیق قطعی گواهی APK با keystore
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          # Capture complete reports first. Early `awk exit` under pipefail can SIGPIPE the producer.
          APK_CERT_REPORT="$("$APKSIGNER" verify --print-certs "$APK")"
          KEY_CERT_REPORT="$(keytool -list -v -keystore app/release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS")"
          APK_CERT="$(printf '%s\n' "$APK_CERT_REPORT" | awk '/certificate SHA-256 digest:/{v=$0; sub(/^.*digest:[[:space:]]*/,"",v)} END{print v}' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          KEY_CERT="$(printf '%s\n' "$KEY_CERT_REPORT" | awk '/SHA-?256:/{v=$0; sub(/^.*SHA-?256:[[:space:]]*/,"",v)} END{print v}' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ ! "$APK_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "APK certificate digest extraction failed (length=${#APK_CERT})"
            exit 1
          fi
          if [[ ! "$KEY_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Keystore certificate digest extraction failed (length=${#KEY_CERT})"
            exit 1
          fi
          if [[ "$APK_CERT" != "$KEY_CERT" ]]; then
            echo "Release APK certificate does not match configured keystore"
            exit 1
          fi
          echo "Release APK signing certificate: VERIFIED"
          # V60.0.1 - چاپ SHA-1 گواهی برای ثبت در Google Cloud (اثرانگشت محرمانه نیست).
          printf '%s\n' "$KEY_CERT_REPORT" | grep -E 'SHA-?1:' | head -n 1 | sed 's/^[[:space:]]*/GOOGLE_SHA1_FOR_OAUTH => /'
      - name: آماده‌سازی بسته انتشار و مشخصات نسخه
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          mkdir -p release
          APK_FILE="exam-app-${APP_VERSION_NAME}-${APP_VERSION_CODE}.apk"
          cp "$SOURCE_APK" "release/$APK_FILE"
          APK_SHA256="$(sha256sum "release/$APK_FILE" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s "release/$APK_FILE")"
          printf 'APP_VERSION_CODE=%s\nAPP_VERSION_NAME=%s\nAPK_FILE=%s\nAPK_SHA256=%s\nAPK_SIZE_BYTES=%s\n' \
            "$APP_VERSION_CODE" "$APP_VERSION_NAME" "$APK_FILE" "$APK_SHA256" "$APK_SIZE_BYTES" \
            > release/update-metadata.txt
          cat release/update-metadata.txt
      - name: بارگذاری APK و مشخصات نسخه در Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: exam-app-release-run-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 1
      - name: انتشار خودکار APK در Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          set -Eeuo pipefail

          safe_error_report() {
            python3 - "$1" "$2" <<'PY'
          import json
          import re
          import sys

          path, prefix = sys.argv[1], sys.argv[2]

          def clean(value):
              text = str(value if value not in (None, "") else "none")
              text = re.sub(r"https?://\S+", "[URL]", text, flags=re.I)
              text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}(?:\.[A-Za-z0-9_-]{10,}){1,2}", "[TOKEN]", text)
              text = re.sub(r"sb_(?:secret|publishable)_[A-Za-z0-9_-]+", "[KEY]", text, flags=re.I)
              text = re.sub(r"(?i)(authorization|apikey)\s*[:=][^,\n ]+", r"\1=[REDACTED]", text)
              return text.replace("\n", " ")[:500]

          try:
              data = json.load(open(path, encoding="utf-8"))
              if not isinstance(data, dict):
                  data = {"code": "unknown", "message": "non-object response"}
          except Exception:
              data = {"code": "unavailable", "message": "response was not valid JSON"}

          for key in ("code", "message", "details", "hint"):
              print(f"{prefix} safe error {key}: {clean(data.get(key))}")
          PY
          }

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_RELEASE_KEY"
          SUPABASE_URL="${SUPABASE_URL%/}"

          RELEASE_AUTH_HEADERS=(-H "apikey: $SUPABASE_RELEASE_KEY")
          if [[ "$SUPABASE_RELEASE_KEY" == sb_secret_* ]]; then
            echo "Release key mode: opaque secret key (apikey header only)"
          else
            echo "Release key mode: legacy server JWT"
            RELEASE_AUTH_HEADERS+=(-H "Authorization: Bearer $SUPABASE_RELEASE_KEY")
          fi

          source release/update-metadata.txt
          test -f "release/$APK_FILE"
          APK_PUBLIC_URL="$SUPABASE_URL/storage/v1/object/public/app-updates/$APK_FILE"

          UPLOAD_STATUS="$(curl -sS \
            --connect-timeout 20 \
            --max-time 600 \
            --retry 3 \
            --retry-all-errors \
            -o /tmp/app-update-storage-response.json \
            -w '%{http_code}' \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/app-updates/$APK_FILE" \
            "${RELEASE_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@release/$APK_FILE")"
          case "$UPLOAD_STATUS" in
            200|201) ;;
            *)
              echo "Supabase Storage upload status: $UPLOAD_STATUS"
              safe_error_report /tmp/app-update-storage-response.json "Supabase Storage"
              exit 1
              ;;
          esac
          echo "Supabase Storage upload status: $UPLOAD_STATUS"

          curl -fsS \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 5 \
            --retry-all-errors \
            --range 0-0 \
            -o /dev/null \
            "$APK_PUBLIC_URL"
          echo "Public APK verification: OK"

          export APK_PUBLIC_URL GITHUB_SHA
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {}
          for line in Path("release/update-metadata.txt").read_text().splitlines():
              key, value = line.split("=", 1)
              metadata[key] = value

          # لیست تغییرات فارسی واقعی از فایل text/CHANGELOG_FA.txt در ریشهٔ repository؛
          # هر سطر یک مورد است. اگر فایل نبود یا خالی بود، یادداشت عمومی استفاده می‌شود.
          payload_notes = []
          changelog_path = Path("text/CHANGELOG_FA.txt")
          if changelog_path.is_file():
              payload_notes = [
                  line.strip().removeprefix("-").removeprefix("•").strip()
                  for line in changelog_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ][:12]
          if not payload_notes:
              payload_notes = [
                  f"انتشار خودکار نسخه {metadata['APP_VERSION_NAME']}",
                  f"ساخت GitHub از commit {os.environ['GITHUB_SHA'][:7]}"
              ]

          payload = {
              "p_version_code": int(metadata["APP_VERSION_CODE"]),
              "p_version_name": metadata["APP_VERSION_NAME"],
              "p_notes_fa": payload_notes,
              "p_apk_url": os.environ["APK_PUBLIC_URL"],
              "p_apk_sha256": metadata["APK_SHA256"],
              "p_apk_size_bytes": int(metadata["APK_SIZE_BYTES"]),
              "p_is_required": False
          }
          Path("release/publish-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          echo "Release RPC endpoint: publish_native_app_release_v1"
          PUBLISH_STATUS="$(curl -sS \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-all-errors \
            -o /tmp/app-update-publish-response.json \
            -w '%{http_code}' \
            -X POST \
            "$SUPABASE_URL/rest/v1/rpc/publish_native_app_release_v1" \
            "${RELEASE_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @release/publish-payload.json)"
          case "$PUBLISH_STATUS" in
            200|201) ;;
            *)
              echo "Supabase release activation status: $PUBLISH_STATUS"
              safe_error_report /tmp/app-update-publish-response.json "Supabase release"
              exit 1
              ;;
          esac
          echo "Supabase release activation status: $PUBLISH_STATUS"
          echo "Automatic app update publication: SUCCESS"

          # Keep current APK plus four newest previous APKs. Non-APK objects are untouched.
          LIST_STATUS="$(curl -sS \
            --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors \
            -o /tmp/app-update-list.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/list/app-updates" \
            "${RELEASE_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data '{"prefix":"","limit":1000,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')"
          test "$LIST_STATUS" = "200"
          export APK_FILE
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          rows = json.loads(Path('/tmp/app-update-list.json').read_text())
          if not isinstance(rows, list): raise SystemExit('storage list was not an array')
          names = [str(x.get('name','')) for x in rows]
          names = [x for x in names if re.fullmatch(r'[A-Za-z0-9._-]+[.]apk', x)]
          keep = {os.environ['APK_FILE']}
          for name in names:
              if len(keep) >= 5: break
              keep.add(name)
          delete = [x for x in names if x not in keep]
          Path('/tmp/app-update-delete.txt').write_text('\n'.join(delete))
          print(f'APK retention candidates: {len(delete)}')
          PY
          RETENTION_DELETED=0
          while IFS= read -r OLD_APK; do
            test -n "$OLD_APK" || continue
            DELETE_STATUS="$(curl -sS -o /tmp/app-update-delete-response.json -w '%{http_code}' \
              -X DELETE "$SUPABASE_URL/storage/v1/object/app-updates/$OLD_APK" \
              "${RELEASE_AUTH_HEADERS[@]}")"
            case "$DELETE_STATUS" in 200|204) RETENTION_DELETED=$((RETENTION_DELETED + 1));; *) exit 1;; esac
          done < /tmp/app-update-delete.txt
          echo "APK retention deleted: $RETENTION_DELETED"
      - name: پاک‌سازی قطعی فایل‌های امضا
        if: always()
        run: |
          rm -f app/release.keystore app/keystore.properties release/publish-payload.json
          test ! -e app/release.keystore
          echo "Ephemeral signing files removed"
