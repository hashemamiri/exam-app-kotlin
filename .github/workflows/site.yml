# V143.5 — انتشار خودکار سایت روی Cloudflare Pages
# با هر push به main که site/ را تغییر دهد (یعنی هر apply_vXX.py سایت)، index.html
# ساخته، کلید anon از Secret تزریق و روی پروژهٔ Pages «onlineexam» منتشر می‌شود.
# Secrets لازم: SUPABASE_ANON_KEY (از قبل هست)، CLOUDFLARE_API_TOKEN، CLOUDFLARE_ACCOUNT_ID
name: site
# V298 — شاخهٔ staging روی همان پروژهٔ Pages با نام شاخه منتشر می‌شود: https://staging.onlineexam.pages.dev (دامنهٔ اصلی فقط از main)
on:
  push:
    branches: [main, staging]
    paths: ['site/**', 'scripts/web_ui_e2e.py', 'scripts/mock_supabase_server.py', '.github/workflows/site.yml']
  workflow_dispatch:
concurrency:
  group: site-deploy-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build index.html with anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY secret is missing"; exit 1; }
          python3 site/build_site.py
          mkdir -p site_out
          python3 - <<'PY'
          import os
          h = open('site/index.html', encoding='utf-8').read()
          old = 'var SUPABASE_ANON_KEY = "…";'
          assert h.count(old) == 1, 'placeholder not found'
          h = h.replace(old, 'var SUPABASE_ANON_KEY = "%s";' % os.environ['SUPABASE_ANON_KEY'])
          # V232.9 — اعلان وب: پیکربندی عمومی فایربیس (apiKey/projectId/appId/messagingSenderId) + کلید VAPID؛ اگر Secret نبود خاموش می‌ماند
          import json
          fbc = (os.environ.get('FIREBASE_WEB_CONFIG_JSON') or '').strip(); vapid = (os.environ.get('FIREBASE_VAPID_KEY') or '').strip()
          if fbc and vapid:
              cfg = json.loads(fbc); cfg = {k: cfg[k] for k in ('apiKey', 'projectId', 'appId', 'messagingSenderId') if k in cfg}
              assert cfg.get('apiKey') and cfg.get('projectId') and cfg.get('appId'), 'FIREBASE_WEB_CONFIG_JSON incomplete'
              o1 = 'var FIREBASE_WEB_CONFIG = null;'; o2 = 'var FIREBASE_VAPID_KEY = "";'
              assert h.count(o1) == 1 and h.count(o2) == 1, 'firebase placeholders not found'
              h = h.replace(o1, 'var FIREBASE_WEB_CONFIG = %s;' % json.dumps(cfg)).replace(o2, 'var FIREBASE_VAPID_KEY = %s;' % json.dumps(vapid))
              print('web push: enabled')
          else:
              print('web push: disabled (secrets missing)')
          open('site_out/index.html', 'w', encoding='utf-8').write(h)
          PY
          # V147 — PWA: مانیفست، آیکون‌ها و Service Worker (نسخهٔ SW = هش index.html تا هر انتشار کش قدیمی را دور بریزد)
          cp -r site/pwa site_out/pwa
          cp site/status.html site_out/status.html  # V228 — صفحهٔ وضعیت سرویس
          cp site/terms.html site/privacy.html site_out/  # V282 — شرایط استفاده و حریم خصوصی
          cp site/robots.txt site/sitemap.xml site/favicon.ico site_out/  # V248 — سئو؛ V248.3 — favicon.ico
          cp site/pay-return.html site_out/  # V335.39 — صفحهٔ بازگشت درگاه در ریشهٔ دامنه (پیش‌تر ۴۰۴/صفحهٔ فرود می‌شد)
          cp site/reset.html site_out/  # V335.45 — صفحهٔ بازنشانی کش (بازسازی ops/reset که فقط روی سرور بود)
          # V162 / V312.1 — موتورهای چاپ/فرمول و پنل‌های پس از ورود در فایل‌های جداگانه با hash در نام (کش دائمی)
          cp site/engines.*.js site_out/
          cp site/panels.*.js site_out/
          # V164 — قلم وزیرمتن (woff2) — کش یک‌ساله
          cp -r site/fonts site_out/fonts
          python3 - <<'PY'
          import glob, hashlib, json, os, re
          html = open('site_out/index.html', encoding='utf-8').read()
          styles = list(re.finditer(r'<style>([\s\S]*?)</style>', html))
          big_style = max(styles, key=lambda m: len(m.group(1)))
          css = big_style.group(1)
          chash = hashlib.sha256(css.encode('utf-8')).hexdigest()[:12]
          depth, mid, split_idx = 0, len(css) // 2, len(css)
          for i, ch in enumerate(css):
              if ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0 and i >= mid:
                      split_idx = i + 1; break
          open(f'site_out/s0.{chash}.css', 'w', encoding='utf-8').write(css[:split_idx])
          open(f'site_out/s1.{chash}.css', 'w', encoding='utf-8').write(css[split_idx:])
          html = html[:big_style.start()] + f'<link rel="stylesheet" href="/s0.{chash}.css"><link rel="stylesheet" href="/s1.{chash}.css">' + html[big_style.end():]
          pfile = sorted(glob.glob('site/panels.*.js'), key=os.path.getmtime)[-1]
          pjs = open(pfile, encoding='utf-8').read()
          phash = hashlib.sha256(pjs.encode('utf-8')).hexdigest()[:12]
          pstep = (len(pjs) + 4) // 5
          pchunks = [pjs[i:i+pstep] for i in range(0, len(pjs), pstep)]
          purls = []
          for idx, pc in enumerate(pchunks):
              pname = f'p{idx}.{phash}.js'; purls.append('/' + pname)
              open(f'site_out/{pname}', 'w', encoding='utf-8').write(f'window.__PJ=window.__PJ||[];window.__PJ[{idx}]={json.dumps(pc, ensure_ascii=False)};\n')
          html = html.replace('window.__PANELS_URL =', f'window.__PANELS_URLS = {json.dumps(purls)}; window.__PANELS_URL =', 1)
          scripts = list(re.finditer(r'<script>([\s\S]*?)</script>', html))
          big_script = max(scripts, key=lambda m: len(m.group(1)))
          js = big_script.group(1)
          jhash = hashlib.sha256(js.encode('utf-8')).hexdigest()[:12]
          jstep = (len(js) + 4) // 5
          jchunks = [js[i:i+jstep] for i in range(0, len(js), jstep)]
          stags = []
          for idx, jc in enumerate(jchunks):
              cname = f'c{idx}.{jhash}.js'; stags.append(f'<script src="/{cname}"></script>')
              tail = "if(window.__CJ&&window.__CJ.length===5&&window.__CJ.filter(Boolean).length===5){var _s=document.createElement('script');_s.textContent=window.__CJ.join('');delete window.__CJ;document.body.appendChild(_s);}"
              open(f'site_out/{cname}', 'w', encoding='utf-8').write(f'window.__CJ=window.__CJ||[];window.__CJ[{idx}]={json.dumps(jc, ensure_ascii=False)};{tail}\n')
          html = html[:big_script.start()] + ''.join(stags) + html[big_script.end():]
          open('site_out/index.html', 'w', encoding='utf-8').write(html)
          h = hashlib.sha256(open('site_out/index.html', 'rb').read()).hexdigest()[:12]
          p = 'site_out/pwa/sw.js'; s = open(p, encoding='utf-8').read()
          assert '__SW_VERSION__' in s
          open(p, 'w', encoding='utf-8').write(s.replace('__SW_VERSION__', h))
          PY
          # هدرها: بدون کش برای index و SW تا به‌روزرسانی فوری دیده شود؛ Alt-Svc: clear برای جلوگیری از گیر کردن QUIC/HTTP3 در اپراتورهای ایران؛ آیکون‌ها کش طولانی
          printf '/*\n  Cache-Control: no-cache\n  Alt-Svc: clear\n  X-Content-Type-Options: nosniff\n  X-Frame-Options: SAMEORIGIN\n  Referrer-Policy: strict-origin-when-cross-origin\n  Strict-Transport-Security: max-age=31536000; includeSubDomains\n/pwa/sw.js\n  Cache-Control: no-cache\n  Service-Worker-Allowed: /\n/pwa/manifest.webmanifest\n  Content-Type: application/manifest+json; charset=utf-8\n/pwa/*.png\n  Cache-Control: public, max-age=604800\n/pwa/v3/*\n  Cache-Control: public, max-age=604800\n/engines.*.js\n  Cache-Control: public, max-age=31536000, immutable\n/panels.*.js\n  Cache-Control: public, max-age=31536000, immutable\n/s*.css\n  Cache-Control: public, max-age=31536000, immutable\n/c*.js\n  Cache-Control: public, max-age=31536000, immutable\n/p*.js\n  Cache-Control: public, max-age=31536000, immutable\n/fonts/*\n  Cache-Control: public, max-age=31536000, immutable\n' > site_out/_headers
      # V333.0 — دروازهٔ خودکار آزمون بصری و تعاملی سرتاسری وب روی مرورگر واقعی Chromium (پیش از انتشار)
      - name: Install Playwright & Chromium for visual UI gate
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium
      - name: Run automated browser visual & E2E gate on site_out
        run: |
          python3 scripts/web_ui_e2e.py --site-dir site_out --out-dir web-ui-report
      - name: Publish Persian visual report to GitHub Step Summary
        if: always()
        run: |
          if [ -f web-ui-report/summary.md ]; then
            cat web-ui-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ گزارش آزمون بصری وب تولید نشد (خطا پیش از اتمام سناریوها)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser visual screenshots & HTML gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-visual-report-${{ github.ref_name }}
          path: web-ui-report/
          retention-days: 14
      # V313.5 — انتشار هم‌زمان روی شاخهٔ gh-pages (GitHub Pages) برای عبور از مسدودی آی‌پی رایگان کلودفلر در همراه اول
      - name: Deploy to GitHub Pages (gh-pages)
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          printf 'onlineexam.ir\n' > site_out/CNAME
          : > site_out/.nojekyll
          cd site_out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:refs/heads/gh-pages
          rm -f CNAME .nojekyll
          rm -rf .git
      # V261.3 — Cloudflare گاهی «Failed to publish your Function. Got error: Unknown internal error occurred.» می‌دهد (خطای موقتی سمت Cloudflare)؛ تا ۳ بار با فاصله تلاش می‌کنیم
      - name: Deploy to Cloudflare Pages
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
      - name: Deploy to Cloudflare Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          preCommands: sleep 45
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
      # V298.1 — نشانی واقعی از خروجی wrangler (زیردامنهٔ pages.dev پروژه لزوماً «onlineexam» نیست)
      - name: نشانی سایت آزمایشی
        if: github.ref_name == 'staging' && (steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success')
        env:
          ALIAS1: ${{ steps.deploy1.outputs.pages-deployment-alias-url }}
          URL1: ${{ steps.deploy1.outputs.deployment-url }}
          ALIAS2: ${{ steps.deploy2.outputs.pages-deployment-alias-url }}
          URL2: ${{ steps.deploy2.outputs.deployment-url }}
        run: |
          A="${ALIAS1:-$ALIAS2}"; U="${URL1:-$URL2}"
          { echo "## 🧪 سایت آزمایشی"; echo; echo "- نشانی ثابت شاخهٔ آزمایشی: ${A:-نامشخص}"; echo "- نشانی همین انتشار: ${U:-نامشخص}"; echo; echo 'پس از تأیید: `python3 scripts/promote.py`'; } >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING SITE: ${A:-?}  (this deploy: ${U:-?})"
      - name: Deploy to Cloudflare Pages (retry 2)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          preCommands: sleep 90
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
      # V335.39 — SYNC_ARVAN: هم‌گام‌سازی دامنهٔ onlineexam.ir روی ابرک آروان (Caddy)
      # چرا: site.yml فقط روی Cloudflare Pages منتشر می‌کند و کپیِ آروان دستی بود؛
      # نتیجه این‌که دامنه در V335.39 روی V335.32 مانده بود. این گام همان شکاف را می‌بندد.
      # فعال‌سازی (یک‌بار): Settings → Variables → New variable: ARVAN_SYNC = on
      #                       Settings → Secrets → ARVAN_SSH_KEY / ARVAN_HOST / ARVAN_WEBROOT
      # بدون این‌ها گام با پیام «skipped» رد می‌شود و CI هرگز نمی‌شکند.
      - name: Sync domain onlineexam.ir (Arvan)
        id: sync_arvan
        if: vars.ARVAN_SYNC == 'on' && github.ref_name == 'main'
        continue-on-error: true
        env:
          ARVAN_SSH_KEY: ${{ secrets.ARVAN_SSH_KEY }}
          ARVAN_HOST: ${{ secrets.ARVAN_HOST }}
          ARVAN_WEBROOT: ${{ secrets.ARVAN_WEBROOT }}
        run: |
          if [ -z "$ARVAN_HOST" ] || [ -z "$ARVAN_SSH_KEY" ]; then
            echo "::warning::ARVAN_SYNC=on ولی ARVAN_HOST/ARVAN_SSH_KEY تنظیم نشده — هم‌گام‌سازی انجام نشد."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # V335.44 — کلید می‌تواند متن خام PEM باشد یا base64 آن؛ CRLF و فاصلهٔ اضافه هم تحمل می‌شود.
          RAW=$(mktemp)
          printf '%s' "$ARVAN_SSH_KEY" | tr -d '\r' > "$RAW"
          [ -n "$(tail -c1 "$RAW" 2>/dev/null)" ] && echo >> "$RAW"   # خط آخر الزامی است
          if grep -q "BEGIN .*PRIVATE KEY" "$RAW"; then
            cp "$RAW" ~/.ssh/arvan
          else
            tr -d ' \n\t' < "$RAW" | base64 -d > ~/.ssh/arvan 2>/dev/null || cp "$RAW" ~/.ssh/arvan
          fi
          rm -f "$RAW"
          chmod 600 ~/.ssh/arvan
          if ! ssh-keygen -y -f ~/.ssh/arvan > /dev/null 2>&1; then
            echo "::error::ARVAN_SSH_KEY قابل خواندن نیست (error in libcrypto)."
            echo "راه‌حل: کلید را base64 کن و همان رشته را در Secret بگذار:"
            echo "  base64 -w0 ~/.ssh/arvan | clip.exe"
            exit 1
          fi
          echo "🔑 کلید SSH سالم است: $(ssh-keygen -y -f ~/.ssh/arvan | cut -c1-32)…"
          ssh-keyscan -H "${ARVAN_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
          python3 scripts/sync_arvan_site.py --apply --from-dir site_out \
            --target "$ARVAN_HOST" --webroot "${ARVAN_WEBROOT:-/var/www/onlineexam}" \
            --ssh-key ~/.ssh/arvan --yes --no-reload
          echo "### ✅ هم‌گام‌سازی دامنه" >> "$GITHUB_STEP_SUMMARY"
          echo 'دامنهٔ `onlineexam.ir` با همین انتشار هم‌تراز شد.' >> "$GITHUB_STEP_SUMMARY"
