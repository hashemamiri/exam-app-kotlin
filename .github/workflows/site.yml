# V143.5 — انتشار خودکار سایت روی Cloudflare Pages
# با هر push به main که site/ را تغییر دهد (یعنی هر apply_vXX.py سایت)، index.html
# ساخته، کلید anon از Secret تزریق و روی پروژهٔ Pages «onlineexam» منتشر می‌شود.
# Secrets لازم: SUPABASE_ANON_KEY (از قبل هست)، CLOUDFLARE_API_TOKEN، CLOUDFLARE_ACCOUNT_ID
name: site
# V298 — شاخهٔ staging روی همان پروژهٔ Pages با نام شاخه منتشر می‌شود: https://staging.onlineexam.pages.dev (دامنهٔ اصلی فقط از main)
on:
  push:
    branches: [main, staging]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
concurrency:
  group: site-deploy-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build index.html with anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY secret is missing"; exit 1; }
          python3 site/build_site.py
          mkdir -p site_out
          python3 - <<'PY'
          import os
          h = open('site/index.html', encoding='utf-8').read()
          old = 'var SUPABASE_ANON_KEY = "…";'
          assert h.count(old) == 1, 'placeholder not found'
          h = h.replace(old, 'var SUPABASE_ANON_KEY = "%s";' % os.environ['SUPABASE_ANON_KEY'])
          # V232.9 — اعلان وب: پیکربندی عمومی فایربیس (apiKey/projectId/appId/messagingSenderId) + کلید VAPID؛ اگر Secret نبود خاموش می‌ماند
          import json
          fbc = (os.environ.get('FIREBASE_WEB_CONFIG_JSON') or '').strip(); vapid = (os.environ.get('FIREBASE_VAPID_KEY') or '').strip()
          if fbc and vapid:
              cfg = json.loads(fbc); cfg = {k: cfg[k] for k in ('apiKey', 'projectId', 'appId', 'messagingSenderId') if k in cfg}
              assert cfg.get('apiKey') and cfg.get('projectId') and cfg.get('appId'), 'FIREBASE_WEB_CONFIG_JSON incomplete'
              o1 = 'var FIREBASE_WEB_CONFIG = null;'; o2 = 'var FIREBASE_VAPID_KEY = "";'
              assert h.count(o1) == 1 and h.count(o2) == 1, 'firebase placeholders not found'
              h = h.replace(o1, 'var FIREBASE_WEB_CONFIG = %s;' % json.dumps(cfg)).replace(o2, 'var FIREBASE_VAPID_KEY = %s;' % json.dumps(vapid))
              print('web push: enabled')
          else:
              print('web push: disabled (secrets missing)')
          open('site_out/index.html', 'w', encoding='utf-8').write(h)
          PY
          # V147 — PWA: مانیفست، آیکون‌ها و Service Worker (نسخهٔ SW = هش index.html تا هر انتشار کش قدیمی را دور بریزد)
          cp -r site/pwa site_out/pwa
          cp site/status.html site_out/status.html  # V228 — صفحهٔ وضعیت سرویس
          cp site/terms.html site/privacy.html site_out/  # V282 — شرایط استفاده و حریم خصوصی
          cp site/robots.txt site/sitemap.xml site/favicon.ico site_out/  # V248 — سئو؛ V248.3 — favicon.ico
          # V162 — موتورهای چاپ/فرمول در فایل جداگانه با hash در نام (کش دائمی)
          cp site/engines.*.js site_out/
          # V164 — قلم وزیرمتن (woff2) — کش یک‌ساله
          cp -r site/fonts site_out/fonts
          python3 - <<'PY'
          import hashlib
          h = hashlib.sha256(open('site_out/index.html', 'rb').read()).hexdigest()[:12]
          p = 'site_out/pwa/sw.js'; s = open(p, encoding='utf-8').read()
          assert '__SW_VERSION__' in s
          open(p, 'w', encoding='utf-8').write(s.replace('__SW_VERSION__', h))
          PY
          # هدرها: بدون کش برای index و SW تا به‌روزرسانی فوری دیده شود؛ آیکون‌ها کش طولانی
          printf '/*\n  Cache-Control: no-cache\n/pwa/sw.js\n  Cache-Control: no-cache\n  Service-Worker-Allowed: /\n/pwa/manifest.webmanifest\n  Content-Type: application/manifest+json; charset=utf-8\n/pwa/*.png\n  Cache-Control: public, max-age=604800\n/engines.*.js\n  Cache-Control: public, max-age=31536000, immutable\n/fonts/*\n  Cache-Control: public, max-age=31536000, immutable\n' > site_out/_headers
      # V261.3 — Cloudflare گاهی «Failed to publish your Function. Got error: Unknown internal error occurred.» می‌دهد (خطای موقتی سمت Cloudflare)؛ تا ۳ بار با فاصله تلاش می‌کنیم
      - name: Deploy to Cloudflare Pages
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
      - name: Deploy to Cloudflare Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          preCommands: sleep 45
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
      # V298.1 — نشانی واقعی از خروجی wrangler (زیردامنهٔ pages.dev پروژه لزوماً «onlineexam» نیست)
      - name: نشانی سایت آزمایشی
        if: github.ref_name == 'staging' && (steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success')
        env:
          ALIAS1: ${{ steps.deploy1.outputs.pages-deployment-alias-url }}
          URL1: ${{ steps.deploy1.outputs.deployment-url }}
          ALIAS2: ${{ steps.deploy2.outputs.pages-deployment-alias-url }}
          URL2: ${{ steps.deploy2.outputs.deployment-url }}
        run: |
          A="${ALIAS1:-$ALIAS2}"; U="${URL1:-$URL2}"
          { echo "## 🧪 سایت آزمایشی"; echo; echo "- نشانی ثابت شاخهٔ آزمایشی: ${A:-نامشخص}"; echo "- نشانی همین انتشار: ${U:-نامشخص}"; echo; echo 'پس از تأیید: `python3 scripts/promote.py`'; } >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING SITE: ${A:-?}  (this deploy: ${U:-?})"
      - name: Deploy to Cloudflare Pages (retry 2)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          preCommands: sleep 90
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=onlineexam --branch=${{ github.ref_name }} --commit-dirty=true
