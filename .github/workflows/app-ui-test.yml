name: تست UI اپ روی شبیه‌ساز
# V333.1 — اجرای خودکار و ایزولهٔ تست بصری و تعاملی Compose روی شبیه‌ساز واقعی Pixel 6 (API 34):
# - در تمام pushها روی main و staging همیشه به‌صورت ۱۰۰٪ ایزوله روی سرور آزمایشی محلی (10.0.2.2:18991)
#   با هر دو نقش معلم و دانش‌آموز (۰ تست ردشده، بدون دست‌زدن به داده‌های واقعی مدرسه) اجرا می‌شود.
# - در اجرای دستی (Run workflow):
#   * به‌طور پیش‌فرض (use_live_supabase = false) روی سرور آزمایشی محلی ایزوله اجرا می‌شود.
#   * در صورت فعال‌کردن دستی use_live_supabase = true، از ورودی‌های دستی یاUI_TEST_TEACHER_USER / UI_TEST_TEACHER_PASS استفاده می‌کند.
on:
  push:
    branches: [main, staging]
    paths:
      - 'app/**'
      - 'text/APP_VERSION.txt'
      - 'scripts/mock_supabase_server.py'
      - '.github/workflows/app-ui-test.yml'
      - '!app/src/test/**'
  workflow_dispatch:
    inputs:
      use_live_supabase:
        description: 'اجرای دستی روی Supabase واقعی (پیش‌فرض false = سرور آزمایشی محلی ایزوله)'
        required: false
        default: false
        type: boolean
      teacher_user:
        description: 'نام کاربری معلم آزمایشی (اختیاری)'
        required: false
        default: ''
      teacher_pass:
        description: 'رمز معلم آزمایشی (اختیاری)'
        required: false
        default: ''
      student_user:
        description: 'نام کاربری دانش‌آموز آزمایشی (اختیاری)'
        required: false
        default: ''
      student_pass:
        description: 'رمز دانش‌آموز آزمایشی (اختیاری)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: app-ui-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v5
      - name: فعال‌سازی KVM برای شبیه‌ساز
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: آماده‌سازی Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: پذیرش مجوزهای SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: راه‌اندازی سرور آزمایشی محلی و تنظیم اتصال ایزوله (خودکار بدون نیاز به Secret)
        id: target_cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_LIVE: ${{ inputs.use_live_supabase }}
          LIVE_URL: ${{ secrets.SUPABASE_URL }}
          LIVE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          IN_USER: ${{ inputs.teacher_user }}
          IN_PASS: ${{ inputs.teacher_pass }}
          IN_STU_USER: ${{ inputs.student_user }}
          IN_STU_PASS: ${{ inputs.student_pass }}
          SEC_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.use_live_supabase && secrets.UI_TEST_TEACHER_USER || '' }}
          SEC_PASS: ${{ github.event_name == 'workflow_dispatch' && inputs.use_live_supabase && secrets.UI_TEST_TEACHER_PASS || '' }}
        run: |
          set -Eeuo pipefail
          mkdir -p android-ui-report
          nohup python3 scripts/mock_supabase_server.py \
            --host 0.0.0.0 \
            --port 18991 \
            --artifact-dir android-ui-report > android-ui-report/mock-server.log 2>&1 &
          echo "mock_pid=$!" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18991/__test__/health > /tmp/mock_health.json 2>/dev/null; then
              break
            fi
            sleep 0.3
          done
          MOCK_ANON="$(python3 -c 'import json; print(json.load(open("/tmp/mock_health.json"))["anon_key"])')"

          T_CAND="${IN_USER:-$SEC_USER}"
          P_CAND="${IN_PASS:-$SEC_PASS}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$USE_LIVE" = "true" ] && [ -n "$T_CAND" ] && [ -n "$P_CAND" ] && [ -n "$LIVE_URL" ] && [ -n "$LIVE_ANON" ]; then
            echo "mode=live-supabase" >> "$GITHUB_OUTPUT"
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_VERSION_CODE=2099999900\nAPP_VERSION_NAME=ui-test\n' \
              "$LIVE_URL" "$LIVE_ANON" > local.properties
            T_USER="$T_CAND"
            T_PASS="$P_CAND"
            echo "::add-mask::$T_PASS"
            S_USER="${IN_STU_USER:-}"
            S_PASS="${IN_STU_PASS:-}"
            [ -n "$S_PASS" ] && echo "::add-mask::$S_PASS"
          else
            echo "mode=local-mock-supabase" >> "$GITHUB_OUTPUT"
            printf 'SUPABASE_URL=http://10.0.2.2:18991\nSUPABASE_ANON_KEY=%s\nAPP_VERSION_CODE=2099999900\nAPP_VERSION_NAME=ui-test\n' \
              "$MOCK_ANON" > local.properties
            EPHEMERAL_CRED="$(python3 -c 'import secrets; print("pw_" + secrets.token_hex(8))')"
            T_USER="uitest_teacher"
            T_PASS="$EPHEMERAL_CRED"
            S_USER="uitest_student"
            S_PASS="$EPHEMERAL_CRED"
          fi
          {
            echo "t_user=$T_USER"
            echo "t_pass=$T_PASS"
            echo "s_user=$S_USER"
            echo "s_pass=$S_PASS"
          } >> "$GITHUB_OUTPUT"
      - name: اجرای تست UI و ثبت گالری بصری روی شبیه‌ساز مدیریت‌شده Pixel 6
        env:
          T_USER: ${{ steps.target_cfg.outputs.t_user }}
          T_PASS: ${{ steps.target_cfg.outputs.t_pass }}
          S_USER: ${{ steps.target_cfg.outputs.s_user }}
          S_PASS: ${{ steps.target_cfg.outputs.s_pass }}
          RUN_MODE: ${{ steps.target_cfg.outputs.mode }}
        run: |
          set +e
          ./gradlew :app:uiPixel6Api34DebugAndroidTest \
            -PbaselineAbi=x86_64 \
            -Pandroid.testInstrumentationRunnerArguments.teacherUser="$T_USER" \
            -Pandroid.testInstrumentationRunnerArguments.teacherPass="$T_PASS" \
            -Pandroid.testInstrumentationRunnerArguments.studentUser="$S_USER" \
            -Pandroid.testInstrumentationRunnerArguments.studentPass="$S_PASS" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          RC=$?
          set -e
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, os, pathlib, xml.etree.ElementTree as ET
          files = sorted(set(
              glob.glob('app/build/**/androidTest-results/**/*.xml', recursive=True) +
              glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          ))
          print('## 📱 نتیجهٔ تست خودکار UI اپ اندروید (`Pixel 6 · API 34`)')
          print(f'- **حالت اتصال سرور:** `{os.environ.get("RUN_MODE", "local-mock-supabase")}`')
          if not files:
              print('- ❌ هیچ فایل نتیجهٔ تست (`XML`) پیدا نشد — لاگ اجرای شبیه‌ساز در بالا را ببینید.')
          for f in files:
              root = ET.parse(f).getroot()
              tests = root.attrib.get('tests', '?')
              skipped = root.attrib.get('skipped', '0')
              failures = root.attrib.get('failures', '0')
              errors = root.attrib.get('errors', '0')
              print(f'- `{f}`: `tests={tests}, skipped={skipped}, failures={failures}, errors={errors}`')
              for tc in root.findall('.//testcase'):
                  name = tc.attrib.get('name', '?')
                  fail = tc.find('failure')
                  err = tc.find('error')
                  skip = tc.find('skipped')
                  if fail is not None or err is not None:
                      node = fail if fail is not None else err
                      msg = (node.attrib.get('message') or '').strip()
                      body = '\n'.join(l for l in (node.text or '').splitlines() if l.strip())[:1400]
                      print(f'  - ❌ **ناموفق:** `{name}` — {msg[:500]}')
                      if body:
                          print('    ```')
                          print(body)
                          print('    ```')
                  elif skip is not None:
                      print(f'  - ⏭️ **ردشده:** `{name}`')
                  else:
                      print(f'  - ✅ **موفق:** `{name}`')
          summary_md = pathlib.Path('android-ui-report/summary.md')
          if summary_md.is_file():
              print()
              print(summary_md.read_text(encoding='utf-8'))
          PY
          exit $RC
      - name: بارگذاری گالری بصری و تصاویر شبیه‌ساز اندروید
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visual-ui-report-${{ github.ref_name }}
          path: |
            android-ui-report/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: توقف سرور آزمایشی محلی
        if: always()
        run: kill "${{ steps.target_cfg.outputs.mock_pid }}" 2>/dev/null || true
