<!doctype html>
<!-- این فایل باید با site/pwa/pay-return.html یکسان بماند (تست V335_32 نسخهٔ site/ را می‌خواند؛ نسخهٔ منتشرشده زیر pwa/ است) -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نتیجهٔ پرداخت</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--ok:#22c55e;--bad:#ef4444;--muted:#94a3b8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
       font-family:Tahoma,sans-serif;background:radial-gradient(circle at 20% 0%,#1e3a5f,#0f172a 60%);color:#e2e8f0}
  .card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:20px;
        padding:26px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .icon{font-size:52px;line-height:1;margin-bottom:10px}
  h1{font-size:20px;margin:0 0 10px}
  p.msg{font-size:15px;line-height:1.9;color:#dbe3ef;margin:0 0 14px}
  .ref{display:inline-block;direction:ltr;background:#0b1220;border:1px solid var(--line);border-radius:10px;
       padding:8px 14px;font-size:14px;color:#93c5fd;margin-bottom:16px}
  .hint{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 16px}
  a.btn,button.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;cursor:pointer;
        background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px;margin-top:8px}
  .btn.ghost{background:transparent;color:#93c5fd;border:1px solid var(--line)}
  .spin{width:34px;height:34px;border:4px solid #334155;border-top-color:#60a5fa;border-radius:50%;
        margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="spin"></div>
  <h1>در حال بررسی پرداخت…</h1>
  <p class="msg">چند لحظه صبر کنید؛ نتیجهٔ پرداخت از درگاه گرفته می‌شود.</p>
</main>
<script>
  // V335.32e — این صفحه خودش نتیجه را از تابع wallet-payment می‌گیرد (JSON) و فارسی و خوانا نشان می‌دهد.
  (function () {
    var ENDPOINT = 'https://sb3.onlineexam.ir/functions/v1/wallet-payment';
    var search = window.location.search || '';
    var card = document.getElementById('card');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
      });
    }

    function render(ok, message, ref, extraHint) {
      var target = ENDPOINT + (search || '?action=verify') + (search ? '&format=json' : '&format=json');
      card.innerHTML =
        '<div class="icon">' + (ok ? '✅' : '❌') + '</div>' +
        '<h1>' + (ok ? 'پرداخت موفق' : 'پرداخت انجام نشد') + '</h1>' +
        '<p class="msg">' + esc(message) + '</p>' +
        (ref ? '<div class="ref">شماره پیگیری: ' + esc(ref) + '</div>' : '') +
        '<p class="hint">' + esc(extraHint || (ok
          ? 'به برنامه برگردید و موجودی کیف پول را تازه‌سازی کنید.'
          : 'اگر مبلغی از حساب شما کم شده، با همین شمارهٔ پیگیری پیگیری می‌شود؛ به پشتیبانی پیام دهید.')) + '</p>' +
        '<a class="btn" href="javascript:window.close()">بستن این صفحه</a>' +
        '<button class="btn ghost" id="retry">بررسی دوباره</button>';
      var retry = document.getElementById('retry');
      if (retry) retry.onclick = function () { load(); };
      window.__target = target;
    }

    function load() {
      card.innerHTML = '<div class="spin"></div><h1>در حال بررسی پرداخت…</h1>' +
                       '<p class="msg">چند لحظه صبر کنید؛ نتیجهٔ پرداخت از درگاه گرفته می‌شود.</p>';
      var url = ENDPOINT + (search ? search + '&format=json' : '?action=verify&format=json');
      window.__target = url;
      var ctl = new AbortController();
      var tid = setTimeout(function () { ctl.abort(); }, 20000);
      fetch(url, {cache: 'no-store', signal: ctl.signal})
        .then(function (r) { return r.json().catch(function () { return {ok: false, message: 'پاسخ سرور خوانا نبود.'}; }); })
        .then(function (d) {
          clearTimeout(tid);
          render(!!d.ok, d.message || 'نتیجه‌ای برنگشت.', d.ref || '', null);
        })
        .catch(function (e) {
          clearTimeout(tid);
          render(false, 'ارتباط با سرور برقرار نشد (' + (e && e.name ? e.name : 'network') + ').',
                 '', 'اینترنت را بررسی کنید و دکمهٔ «بررسی دوباره» را بزنید. اگر مبلغی کم شده، برداشت نمی‌شود.');
        });
    }

    load();
  })();
</script>
</body>
</html>
