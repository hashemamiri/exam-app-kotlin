<style>/* V138 — سایت تک‌فایلی آزمون‌ساز؛ طراحی تمیز، دسکتاپ‌محور، RTL */
:root{
  --bg:#f4f6fa;--card:#ffffff;--ink:#1c2333;--muted:#66708a;--line:#e3e7ef;
  --brand:#1e5eff;--brand-2:#0f3fc2;--brand-soft:#e9efff;--ok:#1f9d55;--ok-soft:#e6f6ec;
  --warn:#d97706;--warn-soft:#fff4e0;--danger:#d92d20;--danger-soft:#fdecea;
  --radius:14px;--shadow:0 6px 24px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;font-size:15px;line-height:1.75}
body{min-height:100vh}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.4}
.hidden{display:none !important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.center{text-align:center}

/* ---------- دکمه‌ها ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 18px;background:var(--brand);color:#fff;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.soft:hover{background:#dbe5ff}
.btn.light{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.light:hover{background:#f3f5f9}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b42318}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 26px;font-size:17px;border-radius:12px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
.icon-btn:hover{background:var(--brand-soft);color:var(--brand);border-color:#c9d6ff}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#f5c2bd}
.icon-btn svg{width:18px;height:18px}

/* ---------- فرم ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:.15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,94,255,.12)}
.field .hint{font-size:12px;color:var(--muted)}
.field.ltr input{direction:ltr;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.alert{border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0;border:1px solid transparent}
.alert.error{background:var(--danger-soft);color:#8a1f16;border-color:#f5c2bd}
.alert.ok{background:var(--ok-soft);color:#155e35;border-color:#bfe6cd}
.alert.info{background:var(--brand-soft);color:#173d9c;border-color:#c9d6ff}
.alert.warn{background:var(--warn-soft);color:#7c4a03;border-color:#f8dcae}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#eef1f6;color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.off{background:#f1f2f5;color:#7b8399}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;color:var(--muted);font-weight:600}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ---------- کارت‌ها/جدول ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;display:flex;align-items:center;gap:8px}
.card + .card{margin-top:16px}
.stat{display:flex;flex-direction:column;gap:4px;padding:18px 20px}
.stat .v{font-size:28px;font-weight:800;color:var(--brand)}
.stat .l{font-size:13px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{font-weight:700;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:2px solid var(--line);font-size:13px}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:#f8faff}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.spinner{width:22px;height:22px;border:3px solid #dfe5f2;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* ---------- لندینگ ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1140px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--ink)}
.logo .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7aa2ff);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.nav{display:flex;gap:18px;margin-inline-start:20px}
.nav a{color:var(--muted);font-weight:600}
.nav a:hover{color:var(--brand)}
@media (max-width:760px){.nav{display:none}}
.hero{max-width:1140px;margin:0 auto;padding:70px 20px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:40px}}
.hero h1{font-size:40px;font-weight:900;line-height:1.35;margin-bottom:14px}
.hero h1 span{color:var(--brand)}
.hero p{font-size:17px;color:var(--muted);margin-bottom:26px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{background:linear-gradient(160deg,#eaf0ff,#f7f9ff);border:1px solid #dfe7ff;border-radius:24px;padding:26px;min-height:320px;position:relative;overflow:hidden}
.sheet{background:#fff;border:1px solid #d5dcea;border-radius:8px;box-shadow:0 10px 30px rgba(30,60,120,.12);padding:18px 20px;width:78%;margin:0 auto;font-size:12px;color:#444;transform:rotate(-2deg)}
.sheet .h{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:10px;font-weight:700}
.sheet .q{margin:6px 0;display:flex;gap:6px}
.sheet .q b{color:var(--brand)}
.sheet .opts{display:flex;gap:14px;margin:4px 16px 8px;color:#666}
.sheet .line{height:1px;background:#e5e5e5;margin:9px 0}
.sheet .f{font-family:'Times New Roman',serif;font-style:italic}
.badge-float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.badge-float.a{top:22px;left:22px;color:var(--ok)}
.badge-float.b{bottom:26px;right:22px;color:var(--brand)}
.section{max-width:1140px;margin:0 auto;padding:40px 20px}
.section h2{font-size:26px;font-weight:800;text-align:center;margin-bottom:8px}
.section .sub{text-align:center;color:var(--muted);margin-bottom:30px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.features{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.features{grid-template-columns:1fr}}
.feature{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.feature .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.feature h3{font-size:16px}
.feature p{color:var(--muted);font-size:14px;margin:0}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.roles{grid-template-columns:1fr}}
.role{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
.role .em{font-size:40px}
.role ul{text-align:right;color:var(--muted);font-size:14px;padding-inline-start:18px;margin:12px 0 18px}
footer{border-top:1px solid var(--line);padding:26px 20px;color:var(--muted);font-size:13px;text-align:center;background:#fff}
.phase-note{max-width:1140px;margin:0 auto 30px;padding:0 20px}

/* ---------- مودال ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto;position:relative}
.modal.wide{max-width:760px}
.modal h2{font-size:20px;margin-bottom:16px}
.modal .x{position:absolute;top:14px;left:14px;border:0;background:#f1f3f8;border-radius:8px;width:32px;height:32px;color:var(--muted)}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1c2333;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .25s}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- پنل ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:18px 20px;border-bottom:1px solid var(--line)}
.sidebar .user{padding:14px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:30px}
.sidebar .user .n{font-weight:700;font-size:14px;line-height:1.3}
.sidebar .user .r{font-size:12px;color:var(--muted)}
.menu{padding:10px;flex:1;overflow:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:600;text-align:right}
.menu button:hover{background:#f3f5f9}
.menu button.on{background:var(--brand-soft);color:var(--brand)}
.menu button .i{width:22px;text-align:center;font-size:17px}
.menu .sep{height:1px;background:var(--line);margin:8px 6px}
.sidebar .foot{padding:12px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0;padding:24px 28px}
.main .head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.main .head h1{font-size:22px;margin:0;flex:1}
.hamb{display:none}
@media (max-width:860px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;z-index:40;transform:translateX(100%);transition:.2s}
  [dir=rtl] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .main{padding:16px}
}
.sb-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39;display:none}
.sb-bg.on{display:block}

/* ---------- کارت آزمون ---------- */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.exam{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.exam .t{font-weight:800;font-size:16px}
.exam .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.exam .code{font-family:monospace;font-size:14px;letter-spacing:1px;background:#f1f3f8;border-radius:6px;padding:1px 8px;direction:ltr;display:inline-block}
.exam .acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-start}

/* ---------- کیف پول ---------- */
.balance{background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;border-radius:16px;padding:22px 24px}
.balance .v{font-size:34px;font-weight:900}
.tx-amt.pos{color:var(--ok);font-weight:700}
.tx-amt.neg{color:var(--danger);font-weight:700}

/* ---------- موتور چاپ / فرمول (روکش تمام‌صفحه) ---------- */
.engine-bg{position:fixed;inset:0;z-index:60;background:#1c2333}
.engine-bg iframe{border:0;width:100%;height:100%;background:#fff}
.engine-bar{position:absolute;top:0;inset-inline:0;height:44px;background:#0f172a;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;z-index:2}
.engine-bar .btn{padding:5px 12px;font-size:13px}
.engine-bg iframe.with-bar{height:calc(100% - 44px);margin-top:44px}
.formula-demo textarea{min-height:120px;direction:rtl}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.soon{border:1px dashed #c9d6ff;background:#f7f9ff;border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.soon b{color:var(--brand)}
code.k{background:#f1f3f8;border-radius:6px;padding:1px 6px;font-size:13px;direction:ltr;display:inline-block}
.warn-key{background:var(--warn-soft);border:1px solid #f8dcae;color:#7c4a03;border-radius:12px;padding:12px 16px;margin:0 auto 18px;max-width:1100px;font-size:14px}

/* ---- فاز ۲: سازندهٔ آزمون ---- */
.builder .b-top .grid3{margin-bottom:0}
.b-body{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:16px;align-items:start}
.b-list{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
.b-add{display:flex;flex-wrap:wrap;gap:6px}
.b-add .btn{flex:1 1 45%;justify-content:center;padding:6px 8px;font-size:12px}
.b-qs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.b-q{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;font-size:13px}
.b-q:hover{border-color:var(--brand)}
.b-q.on{border-color:var(--brand);background:var(--brand-soft)}
.b-q .n{min-width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.b-q .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tool-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative;transition:.15s}
.tool-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.tool-btn.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.tool-btn.on::after{content:'✓';position:absolute;top:-5px;left:-5px;background:var(--brand);color:#fff;font-size:10px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.b-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.b-img{position:relative;width:110px;height:90px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.b-img img{width:100%;height:100%;object-fit:contain}
.b-img .x{position:absolute;top:4px;left:4px;border:0;background:var(--danger);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px}
.b-type{border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
.b-type h4,.b-editor h4{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.b-opt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.b-opt input[type=text],.b-opt select{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff}
.b-opt .thumb{width:44px;height:36px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.b-aud{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;max-height:260px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.b-bank{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto}
.b-bank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.modal.wide{max-width:860px;width:min(860px,94vw)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media (max-width:900px){.b-body{grid-template-columns:1fr}.b-list{position:static;max-height:none}.grid4{grid-template-columns:1fr 1fr}}

/* ---- فاز ۳: پنل دانش‌آموز ---- */
.st-head{display:flex;align-items:center;gap:12px;position:sticky;top:64px;z-index:5}
.st-timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:#173d9c}
.st-timer.danger{background:var(--danger-soft);color:#8a1f16;animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:.55}}
.st-nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.st-dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.st-dot.done{background:var(--ok-soft);border-color:#bfe6cd}
.st-dot.on{border:2px solid var(--brand);font-weight:700}
.st-qtext{line-height:2;margin-bottom:12px}
.st-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.st-imgs img{max-width:260px;max-height:220px;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff}
.st-answer{border-top:1px dashed var(--line);padding-top:12px}
.st-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.st-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.st-optlabel{font-weight:700;color:var(--muted);min-width:28px}
.st-opt .thumb,.st-mr .thumb,.st-ml .thumb{width:64px;height:52px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.st-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.st-match-right{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:10px}
.st-ml{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.st-chips{display:flex;gap:4px;flex-wrap:wrap}
.st-chips .chip{cursor:pointer}
.st-imgsec{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.chip.warn{background:var(--warn-soft);color:#7c4a03}
/* تخته */
.engine-bg.wb{display:flex;flex-direction:column;background:#eceff4}
.wb-bar{flex-wrap:wrap;gap:6px}
.wb-tool{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;width:36px;height:34px;cursor:pointer;font-size:15px}
.wb-tool.on{background:#fff;color:#111}
.wb-sel{border-radius:8px;padding:6px;border:0}
.wb-color{width:34px;height:34px;border:0;background:transparent;padding:0;cursor:pointer}
.wb-size{width:90px}
.wb-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px}
.wb-canvas{background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.15);max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}

/* ---- فاز ۴: تصحیح / مدیر / تقویم ---- */
.g-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.g-list{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.g-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.g-item.on{border-color:var(--brand);background:var(--brand-soft)}
.g-q{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.g-qtext{margin:8px 0;line-height:1.9;white-space:pre-wrap}
.g-resp{margin-top:4px;font-size:14px}
.ok-t{color:#155e35;font-weight:700}.warn-t{color:#7c4a03;font-weight:700}.err-t{color:#8a1f16;font-weight:700}
.chip.ok{background:var(--ok-soft);color:#155e35}.chip.danger{background:var(--danger-soft);color:#8a1f16}
.g-bar{position:relative;height:18px;background:var(--bg);border-radius:9px;min-width:90px;overflow:hidden}
.g-bar div{height:100%;border-radius:9px}
.g-bar span{position:absolute;inset:0;font-size:11px;display:flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-weight:700;color:var(--muted);font-size:13px;padding:6px 0}
.cal-d{min-height:86px;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:#fff;font-size:12px;overflow:hidden}
.cal-d:hover{border-color:var(--brand)}
.cal-d.empty{border:0;background:transparent;cursor:default}
.cal-d.hol .n{color:#c62828}
.cal-d.today{border:2px solid var(--brand)}
.cal-d .n{font-weight:700;font-size:14px;margin-bottom:4px}
.cal-ev{background:var(--brand-soft);color:#173d9c;border-radius:6px;padding:2px 6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.hol{background:var(--danger-soft);color:#8a1f16}

/* ---- فاز ۵: دانش‌آموزان / بانک ---- */
.chip.warn{background:#fff3e0;color:#7c4a03}
button.chip{cursor:pointer;border:0;font-family:inherit}
label.g-item{cursor:pointer}
.row input[type=search],.row select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:inherit;background:#fff}

/* ---- فاز ۶ ---- */
.btn.danger{background:#c62828;color:#fff}
.btn.light.sm.on{border-color:var(--brand);color:var(--brand)}

/* ---- V143.3: ویرایشگر تراشه‌ای کادر متن سؤال + پیش‌نمایش زنده ---- */
.b-ta-wrap{position:relative}
.b-rich{min-height:110px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;line-height:1.8;background:#fff;white-space:pre-wrap;word-break:break-word;outline:none;text-align:right}
.b-rich:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.b-rich:empty::before{content:attr(data-ph);color:#9aa3b2}
.b-chip{display:inline-block;padding:0 8px;margin:0 2px;border-radius:8px;font-size:13px;font-weight:700;background:var(--brand-soft);color:var(--brand);white-space:nowrap;direction:rtl;cursor:pointer;user-select:all;vertical-align:baseline}
.b-chip.tex{background:#fff3e0;color:#7c4a03}
.b-chip:hover{outline:2px solid var(--brand)}
.b-live{margin-top:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:#fafbfe;line-height:1.9;font-size:15px;overflow:auto}
.b-live::before{content:'پیش‌نمایش';display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.b-live img,.b-live svg{max-width:100%}

/* ---- V146: بهینه‌سازی گوشی و تبلت ---- */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img,video,canvas,iframe{max-width:100%}
.tbl-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-wrap table.tbl{min-width:560px}
/* تبلت (≤ 1024px): سایدبار باریک‌تر، فاصله‌های کمتر */
@media (max-width:1024px){
  .sidebar{width:220px;flex-basis:220px}
  .main{padding:20px}

}

  .b-list{order:2}
  .b-editor{order:1}
  .b-add .btn{flex:1 1 30%}
  .tool-btn{width:42px;height:42px}
  .st-dot{width:38px;height:38px}
  .st-imgs img{max-width:100%;max-height:260px}
  .exam-grid{grid-template-columns:1fr}
  .balance .v{font-size:28px}
  .stat .v{font-size:24px}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:8px 12px}
  .toast-wrap{bottom:calc(76px + env(safe-area-inset-bottom));width:calc(100% - 24px)}
  .toast{text-align:center}
  .engine-bar{height:52px;padding:0 8px;gap:6px;overflow-x:auto;white-space:nowrap}
  .engine-bg iframe.with-bar{height:calc(100% - 52px);margin-top:52px}

  .kv{grid-template-columns:1fr}

  /* منوی پایین گوشی (۴ مورد اول سایدبار + «بیشتر») */
  .bottom-nav{position:fixed;bottom:0;inset-inline:0;z-index:38;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}

}

/* گوشی (≤ 600px) */

/* هدف لمسی حداقل ۴۰px روی دستگاه‌های لمسی */

/* ---- V147: PWA ---- */
.pwa-bar{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline:12px;z-index:45;background:#1c2333;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;animation:fade .25s}
.pwa-bar img{width:40px;height:40px;border-radius:10px;flex:0 0 auto}
.pwa-bar .t{flex:1;line-height:1.5}
.pwa-bar .t b{display:block}
.pwa-bar .btn{padding:7px 12px;font-size:13px}
.pwa-bar .x{border:0;background:transparent;color:#fff;font-size:18px;padding:0 4px}
@media (min-width:861px){.pwa-bar{bottom:20px;inset-inline:auto;inset-inline-start:20px;max-width:380px}}
@media (display-mode:standalone){.topbar .in .btn.pwa-hide{display:none}}

/* ---- V148: پوستهٔ موبایل معلم — آینهٔ Design69/Neumorphic اپ ---- */
.m-mode{--m-bg:#E9EEF5;--m-ink:#263142;--m-muted:#7B8798;--m-acc:#6C63F5;--m-acc2:#27C4A8;--m-dark:#ABB7C7;--m-light:#fff;--m-danger:#C85B6B;background:var(--m-bg);font-family:var(--m-font,'Vazirmatn',Tahoma,sans-serif);font-size:calc(15px * var(--m-scale,1))}
/* V162 — تنظیمات ظاهر (AppearanceSection اپ): حالت تیره، پالت (--m-acc/--m-acc2 روی :root)، عمق سایه، قلم، اندازهٔ متن */
.m-dark .m-mode{--m-bg:#1F2530;--m-ink:#E6EAF2;--m-muted:#9AA5B8;--m-dark:#141920;--m-light:#2C3542}
.m-dark body{background:#1F2530}
.m-dark .m-mode .card,.m-dark .m-mode input,.m-dark .m-mode select,.m-dark .m-mode textarea{color:var(--m-ink)}
.m-dark .m-mode input,.m-dark .m-mode select,.m-dark .m-mode textarea{background:#252D3A;border-color:#39424F}
.m-chips{display:flex;gap:6px;justify-content:center;padding:4px 0 10px;flex-wrap:wrap}
.m-switch-row{display:flex;align-items:center;gap:10px}.m-switch-row .grow{flex:1}
.m-switch{width:46px;height:26px;border-radius:13px;border:0;background:var(--m-dark);position:relative;padding:0;flex:0 0 auto;transition:background .15s}
.m-switch i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.m-switch.on{background:var(--m-acc)}.m-switch.on i{transform:translateX(-20px)}
.m-pal-row{display:flex;gap:12px;align-items:center}
.m-pal{width:38px;height:38px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:0;transition:width .12s,height .12s}
.m-pal.on{width:44px;height:44px}.m-pal .mi{width:22px;height:22px}
.m-pal-preview{height:54px;border-radius:18px;background:linear-gradient(135deg,var(--m-acc),var(--m-acc2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.m-range{width:100%;accent-color:var(--m-acc)}
.m-shell{min-height:100dvh;background:var(--m-bg);color:var(--m-ink);display:flex;flex-direction:column}
.m-mode .bottom-nav,.m-mode .pwa-bar{display:none !important}
.neo{background:var(--m-bg);border:0;border-radius:22px;box-shadow:calc(var(--m-depth,14px)/2) calc(var(--m-depth,14px)/2) var(--m-depth,14px) var(--m-dark),calc(var(--m-depth,14px)/-2) calc(var(--m-depth,14px)/-2) var(--m-depth,14px) var(--m-light,#fff);transition:transform .12s,box-shadow .12s}
.neo:active{transform:scale(.97);box-shadow:inset 4px 4px 10px var(--m-dark),inset -4px -4px 10px var(--m-light,#fff)}
.mi{display:inline-flex;width:22px;height:22px}
.mi svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.m-head{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--m-bg)}
.m-head h1{font-size:18px;margin:0;font-weight:800}
.m-back{border:0;background:transparent;color:var(--m-ink);width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.m-back .mi{transform:scaleX(-1)}
.m-content{flex:1;padding:12px 16px calc(112px + env(safe-area-inset-bottom))}
.m-content.no-head{padding-top:calc(14px + env(safe-area-inset-top))}
.m-content .card{background:var(--m-bg);border:0;border-radius:18px;box-shadow:calc(var(--m-depth,14px)/2.3) calc(var(--m-depth,14px)/2.3) var(--m-depth,14px) var(--m-dark),calc(var(--m-depth,14px)/-2.3) calc(var(--m-depth,14px)/-2.3) var(--m-depth,14px) var(--m-light,#fff)}
.m-content .main .head{display:none}
/* داک */
.m-dock{position:fixed;bottom:0;inset-inline:0;z-index:40;padding:8px 14px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.m-dock-panel{pointer-events:auto;height:82px;border-radius:28px;background:var(--m-bg);box-shadow:9px 9px 20px var(--m-dark),-9px -9px 20px var(--m-light,#fff);display:flex;align-items:center;padding:0 8px;direction:rtl}
.m-dock-item{flex:1;border:0;background:transparent;color:var(--m-muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:6px 0;transition:transform .3s}
.m-dock-item .mi{width:24px;height:24px}
.m-dock-item.on{color:var(--m-acc);transform:translateY(-3px)}
.m-dock-item.on .mi{filter:drop-shadow(0 4px 6px rgba(108,99,245,.35))}
.m-dock-add{flex:1;border:0;background:transparent;display:flex;justify-content:center;align-items:center}
.m-dock-add .mi{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--m-acc),var(--m-acc2));color:#fff;padding:14px;box-shadow:0 10px 22px rgba(108,99,245,.4);transition:transform .25s}
.m-dock-add.on .mi{transform:rotate(90deg)}
/* افزودن سریع */
.m-sheet-bg{position:fixed;inset:0;z-index:39;background:rgba(38,49,66,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
@keyframes mpop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
/* منوی کاشی‌ای */
.m-menu{max-width:560px;margin:0 auto}
.m-profile{width:100%;height:148px;border-radius:29px;display:flex;align-items:center;gap:14px;padding:0 18px;text-align:right;color:var(--m-ink);animation:mpop .22s both}
.m-avatar{width:76px;height:76px;border-radius:50%;background:var(--m-bg);box-shadow:inset 4px 4px 8px var(--m-dark),inset -4px -4px 8px var(--m-light,#fff);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--m-acc);overflow:hidden;flex:0 0 auto}
.m-avatar img{width:100%;height:100%;object-fit:cover}
.m-profile-t{flex:1;min-width:0}
.m-profile-t .k{font-size:12px;color:var(--m-muted)}.m-profile-t .n{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m-profile-t .e{font-size:12px;color:var(--m-muted);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-chev{color:var(--m-muted)}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.m-tile{height:116px;border-radius:22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:14px 16px;text-align:right;color:var(--m-ink);animation:mpop .24s both}
.m-tile-ic{width:26px;height:26px;color:var(--m-acc);margin-bottom:4px}
.m-tile b{font-size:15px}.m-tile span{font-size:11px;color:var(--m-muted);line-height:1.5}
.m-tile.sel{box-shadow:inset 5px 5px 10px var(--m-dark),inset -5px -5px 10px var(--m-light,#fff)}
.m-tile.danger .m-tile-ic,.m-tile.danger b{color:var(--m-danger)}
/* آزمون‌ها */
.m-exams{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.m-exams-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.m-outline{border:1px solid var(--m-muted);background:transparent;color:var(--m-acc);border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px}
.m-fab-sm{width:44px;height:44px;border:0;border-radius:14px;background:var(--m-acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(108,99,245,.35)}
.m-note{color:var(--m-muted);font-size:14px;text-align:center;padding:20px 0}
.m-exam{border-radius:18px;padding:9px 12px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:8px 8px 18px var(--m-dark),-8px -8px 18px var(--m-light,#fff)}
.m-exam:active{transform:none}
.m-exam-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-exam-h b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.m-exam-state{font-size:11px;color:var(--m-acc);font-weight:700}
.m-exam-m{font-size:12px;color:var(--m-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-exam-acts{display:flex;justify-content:space-evenly;align-items:center;padding-top:6px;animation:mexp .2s both}
@keyframes mexp{from{opacity:0;max-height:0}to{opacity:1;max-height:60px}}
.m-act{width:44px;height:44px;border:0;background:transparent;color:var(--m-ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.m-act:active{background:rgba(108,99,245,.12)}
.m-act.danger{color:var(--m-danger)}
.m-sheet{width:100%;max-width:520px;background:var(--m-bg);border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.m-sheet h3{font-size:17px;margin-bottom:8px}
.m-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:10px;text-align:right;color:var(--m-ink)}
.m-row b{display:block;font-size:14px}.m-row span{font-size:12px;color:var(--m-muted)}
.m-row-ic{color:var(--m-acc)}
/* کارت‌ها */
/* پوستهٔ موبایل فقط برای عرض کم؛ روی دسکتاپ اصلاً ساخته نمی‌شود ولی برای اطمینان */
@media (min-width:861px){.m-shell{display:none}}

/* ---- V149: دانش‌آموز در پوستهٔ موبایل + رفع کادر خاکستری دسکتاپ ---- */
.m-head-student{justify-content:space-between}
.m-head-student h1{flex:1;text-align:center}
.m-head-student .m-back:last-child .mi{transform:scaleX(-1)}
.m-student-content{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.m-student{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:8px}
.m-title{font-size:22px;font-weight:800;margin:0 0 4px}
.m-note-panel{width:100%;border-radius:22px;padding:12px 14px;text-align:right;display:flex;flex-direction:column;gap:6px;color:var(--m-ink)}
.m-note-panel b{color:var(--m-acc);font-size:16px}.m-note-panel span{font-size:14px}
.m-join{border-radius:26px;padding:16px}
.m-join .card{box-shadow:none;background:transparent;padding:0;max-width:none !important}
.m-join .card h3{display:none}

/* ---- V150: مدیر/معاون در پوستهٔ موبایل ---- */
.m-featured{display:flex;justify-content:center;margin-top:15px}
.m-featured .m-tile{width:52%}

/* ---- V151: صفحه‌های داخلی موبایل به سبک اپ — جدول → کارت ---- */
.m-mode .m-content .tbl-wrap{overflow:visible}

  /* V153 — دستهٔ کارت‌ها مثل اپ: ۳ کارت روی هم (۹۰٪ عرض × ۱۹۰dp، گوشهٔ ۲۹dp)، کشیدن افقی ≥۵۲px کارت را رد می‌کند، نقطه‌ها، پنل توضیح؛ ضربهٔ دوباره روی داک = کارت بعدی */
  var deckIndex = {};
  function cardsDeck(c, key, cards) {
    c.innerHTML = '';
    if (ui.cycle) { deckIndex[key] = ((deckIndex[key] || 0) + 1) % cards.length; ui.cycle = false; }
    var idx = deckIndex[key] || 0;
    var stage = el('div', {class: 'm-deck-stage'});
    var dots = el('div', {class: 'm-deck-dots'});
    var info = el('div', {class: 'm-deck-info neo pressed'}, [el('b'), el('span')]);
    function draw(dir) {
      stage.innerHTML = ''; dots.innerHTML = '';
      for (var rel = 2; rel >= 0; rel--) (function (rel) {
        var k = cards[(idx + rel) % cards.length];
        var card = el('button', {class: 'm-deck-card r' + rel + (dir && rel === 0 ? ' enter' : ''), style: 'background:' + k[3], onclick: function () { if (rel === 0) k[4](); }}, [
          el('div', {class: 'm-deck-top'}, [el('span', {class: 'm-deck-ic', html: I[k[2]]}), el('small', {text: 'آزمون آنلاین'})]),
          el('b', {text: k[0]})
        ]);
        if (rel === 0) swipe(card);
        stage.appendChild(card);
      })(rel);
      cards.forEach(function (_, i) { dots.appendChild(el('i', {class: i === idx ? 'on' : ''})); });
      info.querySelector('b').textContent = cards[idx][0]; info.querySelector('span').textContent = cards[idx][1];
    }
    function swipe(card) {
      var sx = 0, sy = 0, dx = 0, dy = 0, on = false;
      card.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; dx = dy = 0; on = true; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
      card.addEventListener('pointermove', function (e) { if (!on) return; dx = e.clientX - sx; dy = e.clientY - sy; card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx / 42 + dy / 75) + 'deg)'; });
      function end() {
        if (!on) return; on = false; card.style.transition = '';
        if (Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) > 52) {
          card.classList.add('fly'); card.style.transform = 'translate(' + (dx < 0 ? -520 : 520) + 'px,' + (dy * 1.2 - 36) + 'px) rotate(' + (dx < 0 ? 14 : -14) + 'deg) scale(.92)';
          idx = (idx + 1) % cards.length; deckIndex[key] = idx;
          setTimeout(function () { draw(true); }, 260);
        } else card.style.transform = '';
      }
      card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
      card.addEventListener('click', function (e) { if (Math.abs(dx) > 6 || Math.abs(dy) > 6) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    }
    draw(false);
    c.appendChild(el('div', {class: 'm-deck'}, [stage, dots, info]));
  }

  function tableToCards(t) {

      var card = el('div', {class: 'm-rowcard neo', style: 'animation-delay:' + Math.min(ri, 12) * 25 + 'ms'});
      var head = el('div', {class: 'm-rowcard-h'}), body = el('div', {class: 'm-rowcard-b'}), acts = el('div', {class: 'm-rowcard-acts'});
      cells.forEach(function (td, i) {
        var h = heads[i] || '';
        var hasActs = td.querySelector('.acts, .icon-btn, .btn');
        if (hasActs && (!h || i === cells.length - 1)) { while (td.firstChild) acts.appendChild(td.firstChild); return; }
        if (i === 0) { while (td.firstChild) head.appendChild(td.firstChild); return; }
        if (!td.textContent.trim() && !td.firstElementChild) return;
        var line = el('div', {class: 'm-kv'}, [el('span', {class: 'k', text: h ? h + ':' : ''})]);
        var v = el('span', {class: 'v'}); while (td.firstChild) v.appendChild(td.firstChild); line.appendChild(v);

      if (tr.onclick) card.onclick = tr.onclick;

    });

  }
